name: Python Support Guide

on:
  push:
    branches: [main]
    paths:
      - 'support-agent-service/**'
      - '.github/workflows/support-agent.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'support-agent-service/**'
      - '.github/workflows/support-agent.yaml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: support-agent-service
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.23'
          enable-cache: true
          cache-dependency-glob: support-agent-service/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: support-agent-service/frontend/package-lock.json
      - run: uv sync --frozen --python 3.12
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyright
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python -m app.evals.runner
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
