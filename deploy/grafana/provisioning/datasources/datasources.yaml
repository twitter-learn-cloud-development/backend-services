apiVersion: 1

datasources:
  # 1. Loki 日志数据源配置，包含 Logs -> Traces 跳转关联
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      derivedFields:
        - datasourceUid: jaeger
          matcherRegex: '"trace_id":\s*"(\w+)"'
          name: TraceID
          url: '$${__value.raw}'
    editable: true

  # 2. Jaeger 链路追踪数据源配置
  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true

  # 3. Prometheus 指标监控数据源配置
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: true
