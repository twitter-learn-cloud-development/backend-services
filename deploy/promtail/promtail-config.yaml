server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
    pipeline_stages:
      # 1. 第一步：解析 Docker 默认容器日志的外层结构（将 stdout 包装为 JSON）
      - json:
          expressions:
            log: log
            stream: stream
            time: time
      # 2. 第二步：将真正的日志（log 字段）解析为业务 JSON 格式，提取 trace_id, level, msg
      - json:
          expressions:
            level: level
            trace_id: trace_id
            msg: msg
          source: log
      # Keep only bounded labels. trace_id remains in the parsed log payload and
      # must not become a high-cardinality Loki index label.
      - labels:
          level:
