apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "twitter.fullname" . }}-gateway
  labels:
    {{- include "twitter.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "twitter.fullname" . }}-gateway-role
  labels:
    {{- include "twitter.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "twitter.fullname" . }}-gateway-rolebinding
  labels:
    {{- include "twitter.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
subjects:
  - kind: ServiceAccount
    name: {{ include "twitter.fullname" . }}-gateway
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "twitter.fullname" . }}-gateway-role
  apiGroup: rbac.authorization.k8s.io
