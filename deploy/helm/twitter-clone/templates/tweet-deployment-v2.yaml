{{- if .Values.istio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "twitter.fullname" . }}-tweet-v2
  labels:
    {{- include "twitter.labels" . | nindent 4 }}
    app.kubernetes.io/component: tweet-service
spec:
  replicas: 1
  # 🎯 核心修复：选择器只匹配公共组件标签，不匹配 version 标签，防止 K8s 报错
  selector:
    matchLabels:
      app.kubernetes.io/name: twitter-clone
      app.kubernetes.io/component: tweet-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.services.tweetService.metricsPort | quote }}
        prometheus.io/path: "/metrics"
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
      labels:
        {{- include "twitter.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: tweet-service
        version: v2  # 🎯 仅在 Pod 级别定义特征标签，供 Istio DestinationRule 检索
    spec:
      containers:
        - name: tweet-service
          image: "{{ .Values.services.tweetService.image.repository }}:{{ .Values.services.tweetService.image.tag }}"
          imagePullPolicy: {{ .Values.services.tweetService.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.services.tweetService.containerPort }}
              protocol: TCP
          env:
            - name: DB_HOST
              value: {{ include "twitter.mysql.host" . }}
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: {{ .Values.mysql.auth.rootPassword | quote }}
            - name: DB_NAME
              value: {{ .Values.mysql.auth.database | quote }}
            - name: REDIS_HOST
              value: {{ include "twitter.redis.host" . }}
            - name: REDIS_PORT
              value: "6379"
            - name: MQ_HOST
              value: {{ include "twitter.rabbitmq.host" . }}
            - name: MQ_PORT
              value: "5672"
            - name: MQ_USER
              value: {{ .Values.rabbitmq.auth.username | quote }}
            - name: MQ_PASSWORD
              value: {{ .Values.rabbitmq.auth.password | quote }}
            - name: CONSUL_HOST
              value: {{ include "twitter.consul.host" . }}
            - name: CONSUL_PORT
              value: "8500"
            - name: SERVICE_NAME
              value: "tweet-service"
            - name: SERVICE_ADDR
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SERVICE_PORT
              value: {{ .Values.services.tweetService.containerPort | quote }}
            {{- if .Values.services.tweetService.riskControlAuth.enabled }}
            - name: TWEET_INTERNAL_SERVICE_IDENTITY
              value: {{ .Values.services.tweetService.riskControlAuth.identity | quote }}
            - name: TWEET_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.services.tweetService.riskControlAuth.existingSecret | quote }}
                  key: {{ .Values.services.tweetService.riskControlAuth.tokenKey | quote }}
            {{- end }}
            - name: JAEGER_AGENT_HOST
              value: {{ include "twitter.jaeger.host" . }}
            - name: JAEGER_SAMPLER_TYPE
              value: "const"
            - name: JAEGER_SAMPLER_PARAM
              value: "1"
            - name: TWEET_VERSION_TAG
              value: "v2" # 💡 模拟 v2 业务标记以方便在调用结果中识别
          resources:
            {{- toYaml .Values.services.tweetService.resources | default "{}" | nindent 12 }}
{{- end }}
