                  name: {{ .Values.services.agentService.profileCatalog.admin.existingSecret | quote }}
                  key: {{ .Values.services.agentService.profileCatalog.admin.tokenKey | quote }}
            - name: AGENT_PROFILE_ADMIN_USER_IDS
              value: {{ .Values.services.agentService.profileCatalog.admin.userIDs | quote }}
            - name: AGENT_PROFILE_VIEWER_USER_IDS
              value: {{ .Values.services.agentService.profileCatalog.admin.viewerUserIDs | quote }}
            - name: AGENT_PROFILE_EDITOR_USER_IDS
              value: {{ .Values.services.agentService.profileCatalog.admin.editorUserIDs | quote }}
            - name: AGENT_PROFILE_APPROVER_USER_IDS
              value: {{ .Values.services.agentService.profileCatalog.admin.approverUserIDs | quote }}
            {{- end }}
            - name: AGENT_PROMPT_SAMPLING_ENABLED
              value: {{ .Values.services.agentService.promptSampling.enabled | quote }}
            - name: AGENT_PROMPT_SAMPLE_RATIO
              value: {{ .Values.services.agentService.promptSampling.ratio | quote }}
            - name: AGENT_PROMPT_SAMPLE_MAX_BYTES
              value: {{ .Values.services.agentService.promptSampling.maxBytes | quote }}
            - name: JAEGER_AGENT_HOST
              value: {{ include "twitter.jaeger.host" . }}
            - name: JAEGER_SAMPLER_TYPE
              value: "const"
            - name: JAEGER_SAMPLER_PARAM
              value: "1"
            - name: MOCK_EMBEDDING
              value: "true"
          resources:
            {{- toYaml .Values.services.agentService.resources | nindent 12 }}
          {{- if .Values.services.agentService.externalMCP.managedCredentials.enabled }}
          volumeMounts:
            - name: agent-mcp-managed-credentials
              mountPath: {{ .Values.services.agentService.externalMCP.managedCredentials.mountPath | quote }}
              readOnly: true
          {{- end }}
      {{- if .Values.services.agentService.externalMCP.managedCredentials.enabled }}
      volumes:
        - name: agent-mcp-managed-credentials
          secret:
            secretName: {{ .Values.services.agentService.externalMCP.managedCredentials.existingSecret | quote }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "twitter.fullname" . }}-agent
  labels:
    {{- include "twitter.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-service
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.services.agentService.containerPort }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "twitter.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agent-service
