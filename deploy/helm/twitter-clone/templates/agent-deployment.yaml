{{- if and .Values.services.agentService.profileCatalog.admin.existingSecret (or .Values.services.agentService.profileCatalog.admin.dynamicRbacEnabled .Values.services.agentService.profileCatalog.admin.directPublishEnabled) (not .Values.services.agentService.profileCatalog.admin.userIDs) }}
{{- fail "profileCatalog dynamic RBAC or direct publishing requires admin.userIDs" }}
{{- end }}
{{- if and .Values.services.agentService.profileCatalog.experiments.enabled (not .Values.services.agentService.profileCatalog.admin.existingSecret) }}
{{- fail "profileCatalog experiments require admin.existingSecret" }}
{{- end }}
{{- if and .Values.services.agentService.profileCatalog.experiments.enabled (not .Values.services.agentService.profileCatalog.admin.userIDs) }}
{{- fail "profileCatalog experiments require admin.userIDs" }}
{{- end }}
{{- if and .Values.services.agentService.profileCatalog.qualityEvidence.required (not .Values.services.agentService.profileCatalog.admin.existingSecret) }}
{{- fail "profileCatalog quality evidence requires admin.existingSecret" }}
{{- end }}
{{- if and .Values.services.agentService.profileCatalog.qualityEvidence.required (not .Values.services.agentService.profileCatalog.qualityEvidence.existingSecret) }}
{{- fail "profileCatalog quality evidence requires qualityEvidence.existingSecret" }}
{{- end }}
{{- if and .Values.services.agentService.profileCatalog.qualityEvidence.contentSignoffRequired (not .Values.services.agentService.profileCatalog.qualityEvidence.required) }}
{{- fail "profileCatalog content signoff requires qualityEvidence.required" }}
{{- end }}
{{- if and .Values.services.agentService.providerConfig.keyring.enabled (not .Values.services.agentService.providerConfig.existingSecret) }}
{{- fail "providerConfig keyring requires providerConfig.existingSecret" }}
{{- end }}
{{- if and .Values.services.agentService.skillCatalog.enabled (not .Values.services.agentService.workflowAsTool.enabled) }}
{{- fail "skillCatalog requires workflowAsTool.enabled" }}
{{- end }}
{{- if or (lt (int .Values.services.agentService.extensionCatalog.catalogLimit) 1) (gt (int .Values.services.agentService.extensionCatalog.catalogLimit) 50) }}
{{- fail "extensionCatalog.catalogLimit must be within 1..50" }}
{{- end }}
{{- if or (lt (int .Values.services.agentService.extensionMarketplace.catalogLimit) 1) (gt (int .Values.services.agentService.extensionMarketplace.catalogLimit) 50) }}
{{- fail "extensionMarketplace.catalogLimit must be within 1..50" }}
{{- end }}
{{- if and .Values.services.agentService.extensionMarketplace.administration.enabled (not .Values.services.agentService.extensionMarketplace.administration.existingSecret) }}
{{- fail "extensionMarketplace administration requires administration.existingSecret" }}
{{- end }}
{{- if and .Values.services.agentService.extensionMarketplace.administration.enabled (not .Values.services.agentService.extensionMarketplace.administration.administratorUserIDs) }}
{{- fail "extensionMarketplace administration requires administration.administratorUserIDs" }}
{{- end }}
{{- if and .Values.services.agentService.taskTemplates.enabled (not .Values.services.agentService.recoverableRuns.enabled) }}
{{- fail "taskTemplates require recoverableRuns.enabled" }}
{{- end }}
{{- if and .Values.services.agentService.multiAgentPlanner.executionEnabled (not .Values.services.agentService.multiAgentPlanner.enabled) }}
{{- fail "multiAgentPlanner execution requires multiAgentPlanner.enabled" }}
{{- end }}
{{- if and .Values.services.agentService.multiAgentPlanner.executionEnabled (not .Values.services.agentService.recoverableRuns.enabled) }}
{{- fail "multiAgentPlanner execution requires recoverableRuns.enabled" }}
{{- end }}
{{- if and .Values.services.agentService.externalMCP.projectScopeEnabled (not .Values.services.agentService.externalMCP.enabled) }}
{{- fail "externalMCP projectScopeEnabled requires externalMCP.enabled" }}
{{- end }}
{{- if and .Values.services.agentService.externalMCP.managedCredentials.enabled (not .Values.services.agentService.externalMCP.projectScopeEnabled) }}
{{- fail "externalMCP managedCredentials require projectScopeEnabled" }}
{{- end }}
{{- if and .Values.services.agentService.externalMCP.managedCredentials.enabled (not .Values.services.agentService.externalMCP.managedCredentials.existingSecret) }}
{{- fail "externalMCP managedCredentials require managedCredentials.existingSecret" }}
{{- end }}
{{- if and .Values.services.agentService.externalMCP.managedCredentials.enabled (or (empty .Values.services.agentService.externalMCP.managedCredentials.registryJSON) (eq (trim .Values.services.agentService.externalMCP.managedCredentials.registryJSON) "[]")) }}
{{- fail "externalMCP managedCredentials require non-empty registryJSON" }}
{{- end }}
{{- if not (has .Values.services.agentService.processRole (list "api" "worker" "all")) }}
{{- fail "agentService.processRole must be api, worker, or all" }}
{{- end }}
{{- if not (has .Values.services.agentService.trendingReporter.owner (list "temporal" "disabled")) }}
{{- fail "agentService.trendingReporter.owner must be temporal or disabled" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "twitter.fullname" . }}-agent
  labels:
    {{- include "twitter.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-service
spec:
  replicas: {{ .Values.services.agentService.replicaCount }}
  selector:
    matchLabels:
      {{- include "twitter.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.services.agentService.metricsPort | quote }}
        prometheus.io/path: "/metrics"
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
      labels:
        {{- include "twitter.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent-service
    spec:
      containers:
        - name: agent-service
          image: "{{ .Values.services.agentService.image.repository }}:{{ .Values.services.agentService.image.tag }}"
          imagePullPolicy: {{ .Values.services.agentService.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.services.agentService.containerPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.services.agentService.metricsPort }}
              protocol: TCP
          env:
            - name: DB_HOST
              value: {{ include "twitter.mysql.host" . }}
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: {{ .Values.mysql.auth.rootPassword | quote }}
            - name: DB_NAME
              value: {{ .Values.mysql.auth.database | quote }}
            - name: REDIS_HOST
              value: {{ include "twitter.redis.host" . }}
            - name: REDIS_PORT
              value: "6379"
            - name: CONSUL_HOST
              value: {{ include "twitter.consul.host" . }}
            - name: CONSUL_PORT
              value: "8500"
            - name: MONGO_HOST
              value: "{{ include "twitter.fullname" . }}-mongodb"
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_USER
              value: "root"
            - name: MONGO_PASSWORD
              value: "31415927"
            - name: MONGO_DB_NAME
              value: "twitter_agent"
            - name: MQ_HOST
              value: {{ include "twitter.rabbitmq.host" . }}
            - name: MQ_PORT
              value: "5672"
            - name: MQ_USER
              value: {{ .Values.rabbitmq.auth.username | quote }}
            - name: MQ_PASSWORD
              value: {{ .Values.rabbitmq.auth.password | quote }}
            - name: QDRANT_URL
              value: "http://{{ include "twitter.fullname" . }}-qdrant:6333"
            - name: SERVICE_NAME
              value: "agent-service"
            - name: SERVICE_ADDR
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SERVICE_PORT
              value: {{ .Values.services.agentService.containerPort | quote }}
            {{- if .Values.services.tweetService.riskControlAuth.enabled }}
            - name: TWEET_INTERNAL_SERVICE_IDENTITY
              value: {{ .Values.services.tweetService.riskControlAuth.identity | quote }}
            - name: TWEET_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.services.tweetService.riskControlAuth.existingSecret | quote }}
                  key: {{ .Values.services.tweetService.riskControlAuth.tokenKey | quote }}
            {{- end }}
            - name: AGENT_PROCESS_ROLE
              value: {{ .Values.services.agentService.processRole | quote }}
            - name: AGENT_TRENDING_REPORTER_OWNER
              value: {{ .Values.services.agentService.trendingReporter.owner | quote }}
            - name: AGENT_TRENDING_REPORTER_INTERVAL
              value: {{ .Values.services.agentService.trendingReporter.interval | quote }}
            - name: AGENT_METRICS_PORT
              value: {{ .Values.services.agentService.metricsPort | quote }}
            - name: AGENT_TRACE_SAMPLE_RATIO
              value: {{ .Values.services.agentService.traceSampleRatio | quote }}
            - name: AGENT_RECOVERABLE_RUNS_ENABLED
              value: {{ .Values.services.agentService.recoverableRuns.enabled | quote }}
            - name: AGENT_TASK_TEMPLATES_ENABLED
              value: {{ .Values.services.agentService.taskTemplates.enabled | quote }}
            - name: AGENT_TASK_TEMPLATE_LIST_LIMIT
              value: {{ .Values.services.agentService.taskTemplates.listLimit | quote }}
            - name: AGENT_MULTI_AGENT_PLANNER_ENABLED
              value: {{ .Values.services.agentService.multiAgentPlanner.enabled | quote }}
            - name: AGENT_MULTI_AGENT_EXECUTION_ENABLED
              value: {{ .Values.services.agentService.multiAgentPlanner.executionEnabled | quote }}
            - name: AGENT_MULTI_AGENT_MIN_COMPLEXITY_SCORE
              value: {{ .Values.services.agentService.multiAgentPlanner.minimumComplexityScore | quote }}
            - name: AGENT_MULTI_AGENT_MAX_ROLES
              value: {{ .Values.services.agentService.multiAgentPlanner.maxRoles | quote }}
            - name: AGENT_MULTI_AGENT_MAX_PARALLEL_ROLES
              value: {{ .Values.services.agentService.multiAgentPlanner.maxParallelRoles | quote }}
            - name: AGENT_MULTI_AGENT_MAX_ESTIMATED_LATENCY
              value: {{ .Values.services.agentService.multiAgentPlanner.maxEstimatedLatency | quote }}
            - name: AGENT_UNIFIED_APPROVAL_RECOVERY_ENABLED
              value: {{ .Values.services.agentService.recoverableRuns.unifiedApprovalRecoveryEnabled | quote }}
            - name: AGENT_RUN_CHECKPOINT_MAX_BYTES
              value: {{ .Values.services.agentService.recoverableRuns.maxCheckpointBytes | quote }}
            - name: AGENT_RUN_RESUME_LEASE_DURATION
              value: {{ .Values.services.agentService.recoverableRuns.resumeLeaseDuration | quote }}
            {{- if .Values.services.agentService.recoverableRuns.existingSecret }}
            - name: AGENT_RUN_CHECKPOINT_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.services.agentService.recoverableRuns.existingSecret | quote }}
                  key: {{ .Values.services.agentService.recoverableRuns.masterKeyKey | quote }}
            - name: AGENT_RUN_CHECKPOINT_ACTIVE_KEY_ID
              value: {{ .Values.services.agentService.recoverableRuns.activeKeyID | quote }}
            {{- if .Values.services.agentService.recoverableRuns.keyring.enabled }}
            - name: AGENT_RUN_CHECKPOINT_MASTER_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.services.agentService.recoverableRuns.existingSecret | quote }}
                  key: {{ .Values.services.agentService.recoverableRuns.keyring.key | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.services.agentService.providerConfig.existingSecret }}
            - name: AGENT_PROVIDER_CONFIG_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.services.agentService.providerConfig.existingSecret | quote }}
                  key: {{ .Values.services.agentService.providerConfig.masterKeyKey | quote }}
            - name: AGENT_PROVIDER_CONFIG_ACTIVE_KEY_ID
              value: {{ .Values.services.agentService.providerConfig.activeKeyID | quote }}
            {{- if .Values.services.agentService.providerConfig.keyring.enabled }}
            - name: AGENT_PROVIDER_CONFIG_MASTER_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.services.agentService.providerConfig.existingSecret | quote }}
                  key: {{ .Values.services.agentService.providerConfig.keyring.key | quote }}
            {{- end }}
            {{- end }}
            - name: AGENT_EXTERNAL_MCP_ENABLED
