            - name: AGENT_EXTENSION_MARKETPLACE_ADMIN_ENABLED
              value: {{ .Values.services.agentService.extensionMarketplace.administration.enabled | quote }}
            - name: AGENT_EXTENSION_MARKETPLACE_ADMIN_USER_IDS
              value: {{ .Values.services.agentService.extensionMarketplace.administration.administratorUserIDs | quote }}
            {{- if .Values.services.agentService.extensionMarketplace.administration.enabled }}
            - name: AGENT_EXTENSION_MARKETPLACE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.services.agentService.extensionMarketplace.administration.existingSecret | quote }}
                  key: {{ .Values.services.agentService.extensionMarketplace.administration.tokenKey | quote }}
            {{- end }}
            - name: AGENT_EXTERNAL_MCP_PROJECT_SCOPE_ENABLED
              value: {{ .Values.services.agentService.externalMCP.projectScopeEnabled | quote }}
            - name: AGENT_EXTERNAL_MCP_MANAGED_CREDENTIALS_ENABLED
              value: {{ .Values.services.agentService.externalMCP.managedCredentials.enabled | quote }}
            - name: AGENT_EXTERNAL_MCP_MANAGED_CREDENTIALS_JSON
              value: {{ .Values.services.agentService.externalMCP.managedCredentials.registryJSON | quote }}
            - name: AGENT_EXTERNAL_MCP_MANAGED_CREDENTIAL_SECRET_DIR
              value: {{ .Values.services.agentService.externalMCP.managedCredentials.mountPath | quote }}
            - name: AGENT_EXTERNAL_MCP_ALLOWED_HOSTS
              value: {{ .Values.services.agentService.externalMCP.allowedHosts | quote }}
            - name: AGENT_EXTERNAL_MCP_POOL_ENABLED
              value: {{ .Values.services.agentService.externalMCP.pool.enabled | quote }}
            - name: AGENT_EXTERNAL_MCP_POOL_MAX_SESSIONS
              value: {{ .Values.services.agentService.externalMCP.pool.maxSessions | quote }}
            - name: AGENT_EXTERNAL_MCP_POOL_MAX_SESSIONS_PER_CONNECTION
