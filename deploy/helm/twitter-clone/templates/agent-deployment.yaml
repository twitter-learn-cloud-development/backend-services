            - name: AGENT_WORKFLOW_AS_TOOL_ENABLED
              value: {{ .Values.services.agentService.workflowAsTool.enabled | quote }}
            - name: AGENT_WORKFLOW_TOOL_CATALOG_LIMIT
              value: {{ .Values.services.agentService.workflowAsTool.catalogLimit | quote }}
            - name: AGENT_WORKFLOW_TOOL_TIMEOUT
              value: {{ .Values.services.agentService.workflowAsTool.timeout | quote }}
            - name: AGENT_SKILL_CATALOG_ENABLED
