            - name: AGENT_EXTENSION_CATALOG_LIMIT
              value: {{ .Values.services.agentService.extensionCatalog.catalogLimit | quote }}
            - name: AGENT_EXTENSION_MARKETPLACE_ENABLED
              value: {{ .Values.services.agentService.extensionMarketplace.enabled | quote }}
            - name: AGENT_EXTENSION_MARKETPLACE_LIMIT
