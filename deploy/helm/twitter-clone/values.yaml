# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: "standard"
# Autoscaling configuration
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
  hosts:
    - host: twitter-clone.local
      paths:
        - path: /
          pathType: Prefix
# Infrastructure dependencies configuration
# Infrastructure dependencies configuration
mysql:
  enabled: true
  image:
    repository: mysql
    tag: "8.0"
  auth:
    rootPassword: "31415927"
    database: "twitter"
  service:
    port: 3306
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  networkPolicy:
    enabled: false
rabbitmq:
  enabled: true
  image:
    repository: rabbitmq
    tag: "3.13-management"
  auth:
    username: "guest"
    password: "guest"
  service:
    port: 5672
    managementPort: 15672
consul:
  enabled: true
  global:
    name: consul
  connectInject:
    enabled: false
  server:
    replicas: 1
    bootstrapExpect: 1
    extraConfig: |
      {
        "bind_addr": "0.0.0.0"
      }
  ui:
    enabled: false
prometheus:
  enabled: true
  alertmanager:
    enabled: true
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: ['alertname']
        group_wait: 10s
        group_interval: 10s
        repeat_interval: 1h
        receiver: 'notification-webhook'
      receivers:
      - name: 'notification-webhook'
        webhook_configs:
        - url: 'http://twitter-clone-gateway.default.svc.cluster.local:9638/alerts'
          send_resolved: true
          http_config:
            http_headers:
              X-Alertmanager-Token:
                values:
                - "twitter-clone-secret-alert-token"
  server:
    global:
      scrape_interval: 15s
  serverFiles:
    alerting_rules.yml:
      groups:
        - name: twitter-clone-alerts
          rules:
            - alert: TwitterQPSDrop
              expr: sum(rate(http_requests_total[2m])) < 2
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: "Twitter QPS Drop"
                description: "Total QPS has dropped below 2 req/sec for more than 1m (current value: {{ $value }})."
            - alert: TwitterHighLatency
              expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1.0
              for: 1m
              labels:
                severity: warning
              annotations:
                summary: "Twitter High Latency"
                description: "HTTP P99 request latency is above 1 second for more than 1m (current value: {{ $value }}s)."
            - alert: TwitterHighErrorRate
              expr: sum(rate(http_requests_total{status=~"5.."}[2m])) / sum(rate(http_requests_total[2m])) * 100 > 5
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: "Twitter High Error Rate"
                description: "HTTP 5xx error rate has exceeded 5% for more than 1m (current value: {{ $value }}%)."
jaeger:
  enabled: true
  provisionDataStore:
    cassandra: false
    elasticsearch: false
    kafka: false
  allInOne:
    enabled: true
    image:
      repository: jaegertracing/all-in-one
      tag: "1.66.0"
      pullPolicy: IfNotPresent
    extraEnv:
      - name: ADMIN_HTTP_HOST_PORT
        value: ":14269"
    livenessProbe:
      httpGet:
        path: /
        port: 14269
      initialDelaySeconds: 10
      periodSeconds: 15
      failureThreshold: 5
      timeoutSeconds: 2
    readinessProbe:
      httpGet:
        path: /
        port: 14269
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 2
# Microservices configuration
services:
  agentService:
    name: agent-service
    image:
      repository: daguozhai/agent-service
      tag: "latest"
      pullPolicy: IfNotPresent
    replicaCount: 1
    containerPort: 9100
    metricsPort: 9191
    traceSampleRatio: "0.1"
    # Keep `all` for the current combined deployment. Dedicated deployments may
    # use `api` or `worker`; only worker/all processes start background jobs.
    processRole: all
    trendingReporter:
      # Temporal is the sole production scheduler. `disabled` is the rollback.
      owner: temporal
      interval: "1m"
    recoverableRuns:
      # Encrypted ask_human recovery. Approval recovery is a separate rollout.
      enabled: false
      unifiedApprovalRecoveryEnabled: false
      maxCheckpointBytes: 262144
      resumeLeaseDuration: "5m"
      # Secret values are base64 key strings consumed by the application.
      existingSecret: ""
      masterKeyKey: "master-key"
      activeKeyID: "v1"
      keyring:
        enabled: false
        key: "master-keys"
    taskTemplates:
      # Explicit reusable task presets derived from completed authoritative Runs.
      # Requires recoverableRuns.enabled.
      enabled: false
      listLimit: 20
    multiAgentPlanner:
      # Admission and execution have independent rollback switches. Execution
      # currently supports only bounded sequential research-draft templates.
      enabled: false
      executionEnabled: false
      minimumComplexityScore: 6
      maxRoles: 3
      maxParallelRoles: 1
      maxEstimatedLatency: "50s"
    # AES-256-GCM key used for tenant-owned Provider Config and external MCP credentials.
    # Leave empty to disable user-managed credentials while retaining any
    # platform-level providers. The referenced values are base64 key strings.
    providerConfig:
      existingSecret: ""
      masterKeyKey: "master-key"
      activeKeyID: "v1"
      keyring:
        enabled: false
        key: "master-keys"
    externalMCP:
      enabled: false
      projectScopeEnabled: false
      managedCredentials:
        enabled: false
        # Metadata only. Each entry binds reference/project/endpoint/auth_type
        # to one key in existingSecret and includes a positive version.
        registryJSON: "[]"
        existingSecret: ""
        mountPath: "/var/run/secrets/agent-mcp-managed"
      # Controlled internal test hosts only. Public hosts are validated by
      # DNS/IP policy without being listed here.
      allowedHosts: ""
      pool:
        enabled: true
        maxSessions: 64
        maxSessionsPerConnection: 2
        idleTimeout: "5m"
        acquireTimeout: "2s"
      health:
        enabled: false
        pollInterval: "15s"
        interval: "2m"
        timeout: "5s"
        leaseDuration: "15s"
        failureBackoffMin: "30s"
        failureBackoffMax: "15m"
        failureThreshold: 3
        batchSize: 20
        maxConcurrency: 4
      acceptance:
        # One-shot, operator-triggered production evidence job. The strict
        # config contains no token; bearer credentials are mounted by Secret.
        enabled: false
        configJSON: ""
        credentialExistingSecret: ""
        credentialMountPath: "/var/run/secrets/agent-mcp-acceptance"
        integrityExistingSecret: ""
        integrityKeyKey: "integrity-key"
        integrityKeyIDKey: "integrity-key-id"
        allowWrite: false
        expectCredentialRotation: false
        requireComplete: true
        requireSigned: true
        timeout: "3m"
        callTimeout: "15s"
        rotationTimeout: "2m"
        rotationPoll: "1s"
        activeDeadlineSeconds: 300
        ttlSecondsAfterFinished: 86400
    workflowAsTool:
      # Only explicitly published immutable revisions are exposed. Write/risky
      # steps require the governed approval and continuation bridge.
      enabled: false
      catalogLimit: 20
      timeout: "60s"
    skillCatalog:
      # Explicit immutable Skill discovery/execution. Requires workflowAsTool.
      enabled: false
      catalogLimit: 20
    extensionCatalog:
      # Credential-free tenant directory. Source authorization remains owned
      # by Capability, Skill and governed MCP control planes.
      enabled: false
      catalogLimit: 20
    extensionMarketplace:
      # Signature-verified public release metadata. Installation and package
      # execution remain unavailable until their separate control plane lands.
      enabled: false
      catalogLimit: 20
      administration:
        enabled: false
        # Existing Secret contains tokenKey with a 32+ character internal token.
        existingSecret: ""
        tokenKey: "agent-extension-marketplace-admin-token"
        # Comma-separated JWT user IDs allowed to bootstrap and suspend publishers.
        administratorUserIDs: ""
    webSearch:
      enabled: false
      provider: "brave"
      baseURL: "https://api.search.brave.com/res/v1/web/search"
      timeout: "10s"
      maxResults: 10
      maxResponseBytes: 2097152
      maxConcurrent: 8
      searchCacheTTL: "5m"
      allowedHosts: ""
      pageRead:
        enabled: true
        timeout: "12s"
        maxResponseBytes: 2097152
        maxContentRunes: 16000
        maxConcurrent: 8
        cacheTTL: "15m"
        allowedHosts: ""
      cachePrefix: "agent:web:cache"
      governor:
        prefix: "agent:web:governor"
        userRateWindow: "1m"
        userMaxRequests: 30
        runTTL: "24h"
        runMaxRequests: 12
        runMaxCostMicros: 50000
        searchEstimatedCostMicros: 1000
        pageEstimatedCostMicros: 100
      # Optional platform fallback. Users may instead select an encrypted
      # tenant-owned Brave Provider Config when providerConfig is configured.
      existingSecret: ""
      apiKeyKey: "api-key"
    profileCatalog:
      storeEnabled: true
      releaseOverrides: "[]"
      changeChannel: "agent.profile.catalog.changed.v1"
      syncInterval: "30s"
      experiments:
        enabled: false
        reconcileInterval: "30s"
        observationQueueSize: 1024
        contentAttributionWindow: "168h"
      qualityEvidence:
        required: false
        contentSignoffRequired: false
        endpoint: "minio:9000"
        bucket: "agent-task-eval-reports"
        secure: false
        # Secret keys: access-key, secret-key, integrity-key, integrity-key-id,
        # content-signoff-key and content-signoff-key-id.
        existingSecret: ""
        accessKeyKey: "access-key"
        secretKeyKey: "secret-key"
        integrityKeyKey: "integrity-key"
        integrityKeyIDKey: "integrity-key-id"
        contentSignoffKeyKey: "content-signoff-key"
        contentSignoffKeyIDKey: "content-signoff-key-id"
      admin:
        # Existing Secret must contain tokenKey with a 32+ character value.
        existingSecret: ""
        tokenKey: "agent-profile-admin-token"
        # Comma-separated JWT user IDs. Admin inherits every role.
        viewerUserIDs: ""
        editorUserIDs: ""
        approverUserIDs: ""
        userIDs: ""
        # Set false to roll back to environment-only role assignments.
        dynamicRbacEnabled: true
        # Break-glass only; normal version publishing uses editor + approver.
        directPublishEnabled: false
    promptSampling:
      enabled: false
      ratio: "0.01"
      maxBytes: 512
    resources: {}
  userService:
    name: user-service
    image:
      repository: daguozhai/user-service
      tag: "8f00b76f25a34764056587f734a2e252559e6939"
      pullPolicy: IfNotPresent
    replicaCount: 1
    containerPort: 9091
    metricsPort: 2111
    env:
      JAEGER_COLLECTOR_ENDPOINT: "http://jaeger-query-clusterip.default:14268/api/traces"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
  tweetService:
    name: tweet-service
    image:
      repository: daguozhai/tweet-service
      tag: "8f00b76f25a34764056587f734a2e252559e6939"
      pullPolicy: IfNotPresent
    replicaCount: 1
    containerPort: 9092
    metricsPort: 2112
    riskControlAuth:
      # Protects only GetAuthorPostingStats and ApplyTweetModeration. The same
      # Secret is mounted into Tweet and Agent; an empty config keeps these two
      # RPCs fail-closed while all public Tweet RPCs remain available.
      enabled: false
      identity: "agent-service"
      existingSecret: ""
      tokenKey: "tweet-risk-control-token"
    env:
      JAEGER_COLLECTOR_ENDPOINT: "http://jaeger-query-clusterip.default:14268/api/traces"
    resources: {}
  followService:
    name: follow-service
    image:
      repository: daguozhai/follow-service
      tag: 8f00b76f25a34764056587f734a2e252559e6939
      pullPolicy: IfNotPresent
    replicaCount: 1
    containerPort: 9093
    metricsPort: 2113
    resources: {}
  gateway:
    name: gateway
    image:
      repository: daguozhai/gateway
      tag: "v1.0.1-alerts"
      pullPolicy: IfNotPresent
    replicaCount: 1
    service:
      type: LoadBalancer
      port: 9638
      nodePort: 30638
    env:
      GATEWAY_PORT: "9638"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASSWORD: "31415927"
      DB_NAME: "twitter"
      JAEGER_COLLECTOR_ENDPOINT: "http://jaeger-query-clusterip.default:14268/api/traces"
    resources: {}
  consumer:
    name: consumer
    metricsPort: 2116
    image:
      repository: daguozhai/consumer
      tag: "v1.0.1-batching"
      pullPolicy: IfNotPresent
    replicaCount: 1
    resources: {}
  notificationService:
    name: notification-service
    image:
      repository: twitter-clone-notification-service
      tag: "latest"
      pullPolicy: IfNotPresent
    replicaCount: 1
    resources: {}

# KEDA configuration
keda:
  enabled: false
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: 5
  queueLength: 100

# Istio configuration
istio:
  enabled: true

# Qdrant vector database configuration
qdrant:
  enabled: true
  image:
    repository: qdrant/qdrant
    tag: "v1.12.0"
    pullPolicy: IfNotPresent

# Pyroscope profiling configuration
pyroscope:
  enabled: true
  image:
    repository: grafana/pyroscope
    tag: "latest"
    pullPolicy: IfNotPresent


