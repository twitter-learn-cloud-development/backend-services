# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: "standard"
# Autoscaling configuration
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
  hosts:
    - host: twitter-clone.local
      paths:
        - path: /
          pathType: Prefix
# Infrastructure dependencies configuration
# Infrastructure dependencies configuration
mysql:
  enabled: true
  image:
    repository: mysql
    tag: "8.0"
  auth:
    rootPassword: "31415927"
    database: "twitter"
  service:
    port: 3306
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  networkPolicy:
    enabled: false
rabbitmq:
  enabled: true
  image:
    repository: rabbitmq
    tag: "3.13-management"
  auth:
    username: "guest"
    password: "guest"
  service:
    port: 5672
    managementPort: 15672
consul:
  enabled: true
  global:
    name: consul
  connectInject:
    enabled: false
  server:
    replicas: 1
    bootstrapExpect: 1
    extraConfig: |
      {
        "bind_addr": "0.0.0.0"
      }
  ui:
    enabled: false
prometheus:
  enabled: true
  alertmanager:
    enabled: true
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: ['alertname']
        group_wait: 10s
        group_interval: 10s
        repeat_interval: 1h
        receiver: 'notification-webhook'
      receivers:
      - name: 'notification-webhook'
        webhook_configs:
        - url: 'http://twitter-clone-gateway.default.svc.cluster.local:9638/alerts'
          send_resolved: true
          http_config:
            http_headers:
              X-Alertmanager-Token:
                values:
                - "twitter-clone-secret-alert-token"
  server:
    global:
      scrape_interval: 15s
  serverFiles:
    alerting_rules.yml:
      groups:
        - name: twitter-clone-alerts
          rules:
            - alert: TwitterQPSDrop
              expr: sum(rate(http_requests_total[2m])) < 2
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: "Twitter QPS Drop"
                description: "Total QPS has dropped below 2 req/sec for more than 1m (current value: {{ $value }})."
            - alert: TwitterHighLatency
              expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1.0
              for: 1m
              labels:
                severity: warning
              annotations:
                summary: "Twitter High Latency"
                description: "HTTP P99 request latency is above 1 second for more than 1m (current value: {{ $value }}s)."
            - alert: TwitterHighErrorRate
              expr: sum(rate(http_requests_total{status=~"5.."}[2m])) / sum(rate(http_requests_total[2m])) * 100 > 5
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: "Twitter High Error Rate"
                description: "HTTP 5xx error rate has exceeded 5% for more than 1m (current value: {{ $value }}%)."
jaeger:
  enabled: true
  provisionDataStore:
    cassandra: false
    elasticsearch: false
    kafka: false
  allInOne:
    enabled: true
    image:
      repository: jaegertracing/all-in-one
      tag: "1.66.0"
      pullPolicy: IfNotPresent
    extraEnv:
      - name: ADMIN_HTTP_HOST_PORT
        value: ":14269"
    livenessProbe:
      httpGet:
        path: /
        port: 14269
      initialDelaySeconds: 10
      periodSeconds: 15
      failureThreshold: 5
      timeoutSeconds: 2
    readinessProbe:
      httpGet:
        path: /
        port: 14269
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 2
# Microservices configuration
services:
  agentService:
    name: agent-service
    image:
      repository: daguozhai/agent-service
      tag: "latest"
      pullPolicy: IfNotPresent
    replicaCount: 1
    containerPort: 9095
    metricsPort: 2115
    resources: {}
  userService:
    name: user-service
    image:
      repository: daguozhai/user-service
      tag: "8f00b76f25a34764056587f734a2e252559e6939"
      pullPolicy: IfNotPresent
    replicaCount: 1
    containerPort: 9091
    metricsPort: 2111
    env:
      JAEGER_COLLECTOR_ENDPOINT: "http://jaeger-query-clusterip.default:14268/api/traces"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
  tweetService:
    name: tweet-service
    image:
      repository: daguozhai/tweet-service
      tag: "8f00b76f25a34764056587f734a2e252559e6939"
      pullPolicy: IfNotPresent
    replicaCount: 1
    containerPort: 9092
    metricsPort: 2112
    env:
      JAEGER_COLLECTOR_ENDPOINT: "http://jaeger-query-clusterip.default:14268/api/traces"
    resources: {}
  followService:
    name: follow-service
    image:
      repository: daguozhai/follow-service
      tag: 8f00b76f25a34764056587f734a2e252559e6939
      pullPolicy: IfNotPresent
    replicaCount: 1
    containerPort: 9093
    metricsPort: 2113
    resources: {}
  gateway:
    name: gateway
    image:
      repository: daguozhai/gateway
      tag: "v1.0.1-alerts"
      pullPolicy: IfNotPresent
    replicaCount: 1
    service:
      type: LoadBalancer
      port: 9638
      nodePort: 30638
    env:
      GATEWAY_PORT: "9638"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASSWORD: "31415927"
      DB_NAME: "twitter"
      JAEGER_COLLECTOR_ENDPOINT: "http://jaeger-query-clusterip.default:14268/api/traces"
    resources: {}
  consumer:
    name: consumer
    image:
      repository: daguozhai/consumer
      tag: "v1.0.1-batching"
      pullPolicy: IfNotPresent
    replicaCount: 1
    resources: {}
  notificationService:
    name: notification-service
    image:
      repository: twitter-clone-notification-service
      tag: "latest"
      pullPolicy: IfNotPresent
    replicaCount: 1
    resources: {}

# KEDA configuration
keda:
  enabled: false
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: 5
  queueLength: 100

# Istio configuration
istio:
  enabled: true

# Qdrant vector database configuration
qdrant:
  enabled: true
  image:
    repository: qdrant/qdrant
    tag: "v1.12.0"
    pullPolicy: IfNotPresent

# Pyroscope profiling configuration
pyroscope:
  enabled: true
  image:
    repository: grafana/pyroscope
    tag: "latest"
    pullPolicy: IfNotPresent


