groups:
  - name: twitter-clone-follow-projection
    rules:
      - alert: FollowProjectionTasksExhausted
        expr: max by (kind) (follow_projection_backlog{state="exhausted"}) > 0
        for: 5m
        labels:
          severity: warning
          service: consumer
        annotations:
          summary: "Follow projection tasks exhausted their page attempts"
          description: "Review the durable checkpoint and approved repair scope; do not reset retries blindly."
      - alert: FollowProjectionBacklogOld
        expr: max by (kind) (follow_projection_oldest_seconds{state=~"pending|processing|failed"}) > 600
        for: 5m
        labels:
          severity: warning
          service: consumer
        annotations:
          summary: "Follow projection backlog has not converged for ten minutes"
          description: "Inspect SQL, Redis, author lane and relation lane health."
      - alert: FollowProjectionTelemetryUnavailable
        expr: sum(increase(follow_projection_events_total{kind="worker",result="backlog_failed"}[10m])) > 0
        for: 5m
        labels:
          severity: warning
          service: consumer
        annotations:
          summary: "Follow projection backlog telemetry is unavailable"
          description: "The previous backlog gauges may be stale."
  - name: twitter-clone-projection-lifecycle
    rules:
      - alert: TweetProjectionTasksExhausted
        expr: sum by (kind) (tweet_projection_backlog{state="exhausted"}) > 0
        for: 5m
        labels:
          severity: warning
          service: consumer
        annotations:
          summary: "Projection tasks exhausted their bounded attempts"
          description: "Review the persistent failed tasks for this projection kind; do not reset retries blindly."
      - alert: TweetProjectionBacklogOld
        expr: max by (kind) (tweet_projection_oldest_seconds{state=~"pending|processing|failed"}) > 600
        for: 5m
        labels:
          severity: warning
          service: consumer
        annotations:
          summary: "Projection backlog has not converged for ten minutes"
          description: "Inspect backend health, embedding profile and worker lane capacity."
      - alert: TweetProjectionBacklogTelemetryUnavailable
        expr: sum(increase(tweet_projection_backlog_refresh_failures_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
          service: consumer
        annotations:
          summary: "Persistent projection backlog telemetry is unavailable"
          description: "A stale zero gauge must not be interpreted as an empty task queue."
  - name: twitter-clone-availability
    rules:
      - alert: TwitterCloneTargetDown
        expr: up{job=~"gateway|auth-service|user-service|tweet-service|follow-service|messenger-service|consumer|agent-service"} == 0
        for: 2m
        labels:
          severity: critical
          service: "{{ $labels.job }}"
        annotations:
          summary: "Required service target is down"
          description: "Prometheus has failed to scrape {{ $labels.job }} for two minutes."

      - alert: TwitterCloneHTTPErrorRatioHigh
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: critical
          service: gateway
        annotations:
          summary: "Gateway HTTP 5xx ratio is above 5%"
          description: "The aggregate gateway HTTP error ratio has remained above 5% for ten minutes."

      - alert: TwitterCloneRabbitMQBacklogHigh
        expr: sum(rabbitmq_queue_messages_ready) > 1000
        for: 10m
        labels:
          severity: warning
          service: rabbitmq
        annotations:
          summary: "RabbitMQ ready-message backlog is high"
          description: "More than 1000 messages have remained ready across queues for ten minutes."

  - name: twitter-clone-agent-runtime
    rules:
      - alert: AgentProviderErrorRatioHigh
        expr: sum(rate(agent_llm_requests_total{status=~"failed|timeout"}[10m])) / clamp_min(sum(rate(agent_llm_requests_total[10m])), 1) > 0.10
        for: 10m
        labels:
          severity: warning
          service: agent-service
        annotations:
          summary: "Agent model/provider error ratio is above 10%"
          description: "Failed or timed-out LLM requests exceeded 10% for ten minutes."

      - alert: AgentToolFailureRatioHigh
        expr: sum(rate(agent_tool_executions_total{error_code!="none"}[10m])) / clamp_min(sum(rate(agent_tool_executions_total[10m])), 1) > 0.10
        for: 10m
        labels:
          severity: warning
          service: agent-service
        annotations:
          summary: "Governed tool failure ratio is above 10%"
          description: "Tool executions carrying a bounded error code exceeded 10% for ten minutes."

      - alert: AgentExternalMCPHealthFailures
        expr: sum(increase(agent_external_mcp_health_checks_total{result="failed"}[15m])) > 3
        for: 5m
        labels:
          severity: warning
          service: agent-service
        annotations:
          summary: "External MCP health checks are failing"
          description: "More than three governed MCP health checks failed in the last fifteen minutes."

      - alert: AgentPlanningExecuteErrors
        expr: sum(increase(agent_planning_execute_runs_total{outcome="error"}[15m])) > 3
        for: 5m
        labels:
          severity: warning
          service: agent-service
        annotations:
          summary: "Planning-Execute errors are elevated"
          description: "More than three Planning-Execute runs ended in an internal error in fifteen minutes."

      - alert: AgentSessionSummaryFailures
        expr: sum(increase(agent_session_summary_attempts_total{outcome="failed"}[30m])) > 5
        for: 5m
        labels:
          severity: warning
          service: agent-service
        annotations:
          summary: "Durable session summary failures are elevated"
          description: "More than five session summary attempts failed in thirty minutes."

      - alert: AgentEstimatedCostSpike
        expr: sum(increase(agent_llm_estimated_cost_micros_total[1h])) > 5000000
        for: 5m
        labels:
          severity: warning
          service: agent-service
        annotations:
          summary: "Agent estimated model cost increased sharply"
          description: "Estimated model spend exceeded five currency units in the last hour; tune this beta threshold to the provider price book."
