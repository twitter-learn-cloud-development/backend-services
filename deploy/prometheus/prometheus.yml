global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['gateway:2110']

  - job_name: 'user-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['user-service:2111']

  - job_name: 'tweet-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['tweet-service:2112']

  - job_name: 'follow-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['follow-service:2113']

  - job_name: 'auth-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['auth-service:2114']

  - job_name: 'messenger-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['messenger-service:2115']