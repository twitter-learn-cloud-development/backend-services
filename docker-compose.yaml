version: '3.8'

services:
  # === 基础设施 ===
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: twitter
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --server-id=1
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: minio-server
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: twitter_agent
    volumes:
      - mongodb_data:/data/db

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
  # 启动时自动安装 IK，已安装则跳过
    command: >
      bash -c "
        if [ ! -d /usr/share/elasticsearch/plugins/analysis-ik ]; then
          elasticsearch-plugin install --batch https://get.infini.cloud/elasticsearch/analysis-ik/8.13.0;
        fi &&
        /usr/local/bin/docker-entrypoint.sh elasticsearch
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage


  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

  consul:
    image: consul:1.15
    command: "agent -dev -client=0.0.0.0"
    ports:
      - "8500:8500"
      - "8600:8600/udp"

  jaeger:
    image: jaegertracing/all-in-one:1.37
    ports:
      - "16686:16686"
      - "6831:6831/udp"
      - "4317:4317"
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_OTLP_ENABLED=true

  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
  kibana:
    image: kibana:8.13.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/data

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deploy/promtail/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.0.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
      - loki
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning

  auth-service:
    build:
      context: .
      dockerfile: deploy/docker/auth.dockerfile
    environment:
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_NAME=auth-service
      - SERVICE_ADDR=auth-service
      - SERVICE_PORT=9097
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_SAMPLER_TYPE=const
      - JAEGER_SAMPLER_PARAM=1
      - JAEGER_COLLECTOR_ENDPOINT=jaeger:4317
      - USER_SERVICE_ADDR=user-service:9091
    ports:
      - "9097:9097"
      - "8081:8081"
    restart: on-failure
    depends_on:
      consul:
        condition: service_started
      user-service:
        condition: service_started
      redis:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: deploy/docker/user.dockerfile
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=twitter
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - SERVICE_NAME=user-service
      - SERVICE_ADDR=user-service
      - SERVICE_PORT=9091
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_SAMPLER_TYPE=const
      - JAEGER_SAMPLER_PARAM=1
      - JAEGER_COLLECTOR_ENDPOINT=jaeger:4317
      - JWT_SECRET=twitter_clone_secret_key_2023
    # ports:
    #   - "9091:9091"
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  tweet-service:
    build:
      context: .
      dockerfile: deploy/docker/tweet.dockerfile
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=twitter
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MQ_HOST=rabbitmq
      - MQ_PORT=5672
      - MQ_USER=guest
      - MQ_PASSWORD=guest
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - SERVICE_NAME=tweet-service
      - SERVICE_ADDR=tweet-service
      - SERVICE_PORT=9092
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_SAMPLER_TYPE=const
      - JAEGER_SAMPLER_PARAM=1
      - JAEGER_COLLECTOR_ENDPOINT=jaeger:4317
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
      - TWEET_MAX_CONTENT_LENGTH=10000
      - TWEET_HARD_MAX_CONTENT_LENGTH=20000
      - TWEET_INTERNAL_SERVICE_IDENTITY=${TWEET_INTERNAL_SERVICE_IDENTITY:-agent-service}
      - TWEET_INTERNAL_SERVICE_TOKEN=${TWEET_INTERNAL_SERVICE_TOKEN:-}
    # ports:
    #   - "9092:9092"
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  follow-service:
    build:
      context: .
      dockerfile: deploy/docker/follow.dockerfile
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=twitter
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MQ_HOST=rabbitmq
      - MQ_PORT=5672
      - MQ_USER=guest
      - MQ_PASSWORD=guest
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - SERVICE_NAME=follow-service
      - SERVICE_ADDR=follow-service
      - SERVICE_PORT=9093
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_SAMPLER_TYPE=const
      - JAEGER_SAMPLER_PARAM=1
      - JAEGER_COLLECTOR_ENDPOINT=jaeger:4317
    # ports:
    #   - "9093:9093"
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # === Canal 旁路中继器 ===
  canal-relay:
    build:
      context: .
      dockerfile: deploy/docker/canal-relay.dockerfile
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=twitter
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MQ_HOST=rabbitmq
      - MQ_PORT=5672
      - MQ_USER=guest
      - MQ_PASSWORD=guest
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # === 消费者 ===
  consumer:
    build:
      context: .
      dockerfile: deploy/docker/consumer.dockerfile
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=twitter
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MQ_HOST=rabbitmq
      - MQ_PORT=5672
      - MQ_USER=guest
      - MQ_PASSWORD=guest
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_SAMPLER_TYPE=const
      - JAEGER_SAMPLER_PARAM=1
      - JAEGER_COLLECTOR_ENDPOINT=jaeger:4317
      - ES_ADDRESSES=http://elasticsearch:9200
      - QDRANT_URL=http://qdrant:6333
      - LM_STUDIO_API_URL=http://host.docker.internal:1234/v1
      - LM_STUDIO_MODEL_EMBEDDING=text-embedding-bge-m3
      - LM_STUDIO_MODEL_CHAT=qwen2.5-3b-instruct
      - CONSUMER_METRICS_PORT=2116
    expose:
      - "2116"
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      qdrant:
        condition: service_started

  agent-service:
    build:
      context: .
      dockerfile: deploy/docker/agent.dockerfile
    environment:
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - SERVICE_NAME=agent-service
      - SERVICE_ADDR=agent-service
      - SERVICE_PORT=9100
      - AGENT_PROCESS_ROLE=${AGENT_PROCESS_ROLE:-all}
      - AGENT_TRENDING_REPORTER_OWNER=${AGENT_TRENDING_REPORTER_OWNER:-temporal}
      - AGENT_TRENDING_REPORTER_INTERVAL=${AGENT_TRENDING_REPORTER_INTERVAL:-1m}
      - MCP_SERVER_ADDR=127.0.0.1:9200
      - AGENT_MCP_AUTH_TOKEN=${AGENT_MCP_AUTH_TOKEN:-}
      - AGENT_METRICS_PORT=9191
      - AGENT_TRACE_SAMPLE_RATIO=${AGENT_TRACE_SAMPLE_RATIO:-1}
      - AGENT_PROVIDER_CONFIG_MASTER_KEY=${AGENT_PROVIDER_CONFIG_MASTER_KEY:-}
      - AGENT_PROVIDER_CONFIG_ACTIVE_KEY_ID=${AGENT_PROVIDER_CONFIG_ACTIVE_KEY_ID:-v1}
      - AGENT_PROVIDER_CONFIG_MASTER_KEYS=${AGENT_PROVIDER_CONFIG_MASTER_KEYS:-}
      - AGENT_EXTERNAL_MCP_ENABLED=${AGENT_EXTERNAL_MCP_ENABLED:-false}
      - AGENT_WORKFLOW_AS_TOOL_ENABLED=${AGENT_WORKFLOW_AS_TOOL_ENABLED:-false}
      - AGENT_WORKFLOW_TOOL_CATALOG_LIMIT=${AGENT_WORKFLOW_TOOL_CATALOG_LIMIT:-20}
      - AGENT_WORKFLOW_TOOL_TIMEOUT=${AGENT_WORKFLOW_TOOL_TIMEOUT:-60s}
      - AGENT_SKILL_CATALOG_ENABLED=${AGENT_SKILL_CATALOG_ENABLED:-false}
      - AGENT_SKILL_CATALOG_LIMIT=${AGENT_SKILL_CATALOG_LIMIT:-20}
      - AGENT_EXTENSION_CATALOG_ENABLED=${AGENT_EXTENSION_CATALOG_ENABLED:-false}
      - AGENT_EXTENSION_CATALOG_LIMIT=${AGENT_EXTENSION_CATALOG_LIMIT:-20}
      - AGENT_EXTENSION_MARKETPLACE_ENABLED=${AGENT_EXTENSION_MARKETPLACE_ENABLED:-false}
      - AGENT_EXTENSION_MARKETPLACE_LIMIT=${AGENT_EXTENSION_MARKETPLACE_LIMIT:-20}
      - AGENT_EXTENSION_MARKETPLACE_ADMIN_ENABLED=${AGENT_EXTENSION_MARKETPLACE_ADMIN_ENABLED:-false}
      - AGENT_EXTENSION_MARKETPLACE_ADMIN_TOKEN=${AGENT_EXTENSION_MARKETPLACE_ADMIN_TOKEN:-}
      - AGENT_EXTENSION_MARKETPLACE_ADMIN_USER_IDS=${AGENT_EXTENSION_MARKETPLACE_ADMIN_USER_IDS:-}
      - AGENT_EXTERNAL_MCP_PROJECT_SCOPE_ENABLED=${AGENT_EXTERNAL_MCP_PROJECT_SCOPE_ENABLED:-false}
      - AGENT_EXTERNAL_MCP_MANAGED_CREDENTIALS_ENABLED=${AGENT_EXTERNAL_MCP_MANAGED_CREDENTIALS_ENABLED:-false}
      - AGENT_EXTERNAL_MCP_MANAGED_CREDENTIALS_JSON=${AGENT_EXTERNAL_MCP_MANAGED_CREDENTIALS_JSON:-[]}
      - AGENT_EXTERNAL_MCP_MANAGED_CREDENTIAL_SECRET_DIR=${AGENT_EXTERNAL_MCP_MANAGED_CREDENTIAL_SECRET_DIR:-/var/run/secrets/agent-mcp-managed}
      - AGENT_RECOVERABLE_RUNS_ENABLED=${AGENT_RECOVERABLE_RUNS_ENABLED:-false}
      - AGENT_GOAL_RUNTIME_ENABLED=${AGENT_GOAL_RUNTIME_ENABLED:-false}
      - AGENT_GOAL_RUNTIME_PLATFORM_SEARCH_SHADOW_ENABLED=${AGENT_GOAL_RUNTIME_PLATFORM_SEARCH_SHADOW_ENABLED:-false}
      - AGENT_GOAL_RUNTIME_WEB_RESEARCH_SHADOW_ENABLED=${AGENT_GOAL_RUNTIME_WEB_RESEARCH_SHADOW_ENABLED:-false}
      - AGENT_GOAL_RUNTIME_GROUNDED_DRAFT_SHADOW_ENABLED=${AGENT_GOAL_RUNTIME_GROUNDED_DRAFT_SHADOW_ENABLED:-false}
      - AGENT_GOAL_RUNTIME_RESEARCH_DRAFT_SHADOW_ENABLED=${AGENT_GOAL_RUNTIME_RESEARCH_DRAFT_SHADOW_ENABLED:-false}
      - AGENT_TASK_TEMPLATES_ENABLED=${AGENT_TASK_TEMPLATES_ENABLED:-false}
      - AGENT_TASK_TEMPLATE_LIST_LIMIT=${AGENT_TASK_TEMPLATE_LIST_LIMIT:-20}
      - AGENT_MULTI_AGENT_PLANNER_ENABLED=${AGENT_MULTI_AGENT_PLANNER_ENABLED:-false}
      - AGENT_MULTI_AGENT_EXECUTION_ENABLED=${AGENT_MULTI_AGENT_EXECUTION_ENABLED:-false}
      - AGENT_MULTI_AGENT_MIN_COMPLEXITY_SCORE=${AGENT_MULTI_AGENT_MIN_COMPLEXITY_SCORE:-6}
      - AGENT_MULTI_AGENT_MAX_ROLES=${AGENT_MULTI_AGENT_MAX_ROLES:-3}
      - AGENT_MULTI_AGENT_MAX_PARALLEL_ROLES=${AGENT_MULTI_AGENT_MAX_PARALLEL_ROLES:-1}
      - AGENT_MULTI_AGENT_MAX_ESTIMATED_LATENCY=${AGENT_MULTI_AGENT_MAX_ESTIMATED_LATENCY:-50s}
      - AGENT_UNIFIED_APPROVAL_RECOVERY_ENABLED=${AGENT_UNIFIED_APPROVAL_RECOVERY_ENABLED:-false}
      - AGENT_RUN_CHECKPOINT_MASTER_KEY=${AGENT_RUN_CHECKPOINT_MASTER_KEY:-}
      - AGENT_RUN_CHECKPOINT_ACTIVE_KEY_ID=${AGENT_RUN_CHECKPOINT_ACTIVE_KEY_ID:-v1}
      - AGENT_RUN_CHECKPOINT_MASTER_KEYS=${AGENT_RUN_CHECKPOINT_MASTER_KEYS:-}
      - AGENT_RUN_CHECKPOINT_MAX_BYTES=${AGENT_RUN_CHECKPOINT_MAX_BYTES:-262144}
      - AGENT_RUN_RESUME_LEASE_DURATION=${AGENT_RUN_RESUME_LEASE_DURATION:-5m}
      - AGENT_EXTERNAL_MCP_ALLOWED_HOSTS=${AGENT_EXTERNAL_MCP_ALLOWED_HOSTS:-}
      - AGENT_EXTERNAL_MCP_POOL_ENABLED=${AGENT_EXTERNAL_MCP_POOL_ENABLED:-true}
      - AGENT_EXTERNAL_MCP_POOL_MAX_SESSIONS=${AGENT_EXTERNAL_MCP_POOL_MAX_SESSIONS:-64}
      - AGENT_EXTERNAL_MCP_POOL_MAX_SESSIONS_PER_CONNECTION=${AGENT_EXTERNAL_MCP_POOL_MAX_SESSIONS_PER_CONNECTION:-2}
      - AGENT_EXTERNAL_MCP_POOL_IDLE_TIMEOUT=${AGENT_EXTERNAL_MCP_POOL_IDLE_TIMEOUT:-5m}
      - AGENT_EXTERNAL_MCP_POOL_ACQUIRE_TIMEOUT=${AGENT_EXTERNAL_MCP_POOL_ACQUIRE_TIMEOUT:-2s}
      - AGENT_EXTERNAL_MCP_HEALTH_CHECK_ENABLED=${AGENT_EXTERNAL_MCP_HEALTH_CHECK_ENABLED:-false}
      - AGENT_EXTERNAL_MCP_HEALTH_POLL_INTERVAL=${AGENT_EXTERNAL_MCP_HEALTH_POLL_INTERVAL:-15s}
      - AGENT_EXTERNAL_MCP_HEALTH_INTERVAL=${AGENT_EXTERNAL_MCP_HEALTH_INTERVAL:-2m}
      - AGENT_EXTERNAL_MCP_HEALTH_TIMEOUT=${AGENT_EXTERNAL_MCP_HEALTH_TIMEOUT:-5s}
      - AGENT_EXTERNAL_MCP_HEALTH_LEASE_DURATION=${AGENT_EXTERNAL_MCP_HEALTH_LEASE_DURATION:-15s}
      - AGENT_EXTERNAL_MCP_HEALTH_FAILURE_BACKOFF_MIN=${AGENT_EXTERNAL_MCP_HEALTH_FAILURE_BACKOFF_MIN:-30s}
      - AGENT_EXTERNAL_MCP_HEALTH_FAILURE_BACKOFF_MAX=${AGENT_EXTERNAL_MCP_HEALTH_FAILURE_BACKOFF_MAX:-15m}
      - AGENT_EXTERNAL_MCP_HEALTH_FAILURE_THRESHOLD=${AGENT_EXTERNAL_MCP_HEALTH_FAILURE_THRESHOLD:-3}
      - AGENT_EXTERNAL_MCP_HEALTH_BATCH_SIZE=${AGENT_EXTERNAL_MCP_HEALTH_BATCH_SIZE:-20}
      - AGENT_EXTERNAL_MCP_HEALTH_MAX_CONCURRENCY=${AGENT_EXTERNAL_MCP_HEALTH_MAX_CONCURRENCY:-4}
      - AGENT_WEB_SEARCH_ENABLED=${AGENT_WEB_SEARCH_ENABLED:-false}
      - AGENT_WEB_SEARCH_PROVIDER=${AGENT_WEB_SEARCH_PROVIDER:-brave}
      - AGENT_WEB_SEARCH_BASE_URL=${AGENT_WEB_SEARCH_BASE_URL:-https://api.search.brave.com/res/v1/web/search}
      - AGENT_WEB_SEARCH_API_KEY=${AGENT_WEB_SEARCH_API_KEY:-}
      - AGENT_WEB_SEARCH_TIMEOUT=${AGENT_WEB_SEARCH_TIMEOUT:-10s}
      - AGENT_WEB_SEARCH_MAX_RESULTS=${AGENT_WEB_SEARCH_MAX_RESULTS:-10}
      - AGENT_WEB_SEARCH_MAX_RESPONSE_BYTES=${AGENT_WEB_SEARCH_MAX_RESPONSE_BYTES:-2097152}
      - AGENT_WEB_SEARCH_MAX_CONCURRENT=${AGENT_WEB_SEARCH_MAX_CONCURRENT:-8}
      - AGENT_WEB_SEARCH_CACHE_TTL=${AGENT_WEB_SEARCH_CACHE_TTL:-5m}
      - AGENT_WEB_SEARCH_ALLOWED_HOSTS=${AGENT_WEB_SEARCH_ALLOWED_HOSTS:-}
      - AGENT_WEB_PAGE_READ_ENABLED=${AGENT_WEB_PAGE_READ_ENABLED:-true}
      - AGENT_WEB_PAGE_TIMEOUT=${AGENT_WEB_PAGE_TIMEOUT:-12s}
      - AGENT_WEB_PAGE_MAX_RESPONSE_BYTES=${AGENT_WEB_PAGE_MAX_RESPONSE_BYTES:-2097152}
      - AGENT_WEB_PAGE_MAX_CONTENT_RUNES=${AGENT_WEB_PAGE_MAX_CONTENT_RUNES:-16000}
      - AGENT_WEB_PAGE_MAX_CONCURRENT=${AGENT_WEB_PAGE_MAX_CONCURRENT:-8}
      - AGENT_WEB_PAGE_CACHE_TTL=${AGENT_WEB_PAGE_CACHE_TTL:-15m}
      - AGENT_WEB_PAGE_ALLOWED_HOSTS=${AGENT_WEB_PAGE_ALLOWED_HOSTS:-}
      - AGENT_WEB_CACHE_PREFIX=${AGENT_WEB_CACHE_PREFIX:-agent:web:cache}
      - AGENT_WEB_GOVERNOR_PREFIX=${AGENT_WEB_GOVERNOR_PREFIX:-agent:web:governor}
      - AGENT_WEB_USER_RATE_WINDOW=${AGENT_WEB_USER_RATE_WINDOW:-1m}
      - AGENT_WEB_USER_MAX_REQUESTS=${AGENT_WEB_USER_MAX_REQUESTS:-30}
      - AGENT_WEB_RUN_TTL=${AGENT_WEB_RUN_TTL:-24h}
      - AGENT_WEB_RUN_MAX_REQUESTS=${AGENT_WEB_RUN_MAX_REQUESTS:-12}
      - AGENT_WEB_RUN_MAX_COST_MICROS=${AGENT_WEB_RUN_MAX_COST_MICROS:-50000}
      - AGENT_WEB_SEARCH_ESTIMATED_COST_MICROS=${AGENT_WEB_SEARCH_ESTIMATED_COST_MICROS:-1000}
      - AGENT_WEB_PAGE_ESTIMATED_COST_MICROS=${AGENT_WEB_PAGE_ESTIMATED_COST_MICROS:-100}
      - AGENT_PROMPT_SAMPLING_ENABLED=${AGENT_PROMPT_SAMPLING_ENABLED:-false}
      - AGENT_PROMPT_SAMPLE_RATIO=${AGENT_PROMPT_SAMPLE_RATIO:-0.01}
      - AGENT_PROMPT_SAMPLE_MAX_BYTES=${AGENT_PROMPT_SAMPLE_MAX_BYTES:-512}
      - AGENT_RUNTIME_V2_MODES=${AGENT_RUNTIME_V2_MODES:-}
      - AGENT_PROFILE_STORE_ENABLED=${AGENT_PROFILE_STORE_ENABLED:-true}
      - AGENT_PROFILE_RELEASES=${AGENT_PROFILE_RELEASES:-[]}
      - AGENT_PROFILE_CHANGE_CHANNEL=${AGENT_PROFILE_CHANGE_CHANNEL:-agent.profile.catalog.changed.v1}
      - AGENT_PROFILE_SYNC_INTERVAL=${AGENT_PROFILE_SYNC_INTERVAL:-30s}
      - AGENT_PROFILE_ADMIN_TOKEN=${AGENT_PROFILE_ADMIN_TOKEN:-}
      - AGENT_PROFILE_VIEWER_USER_IDS=${AGENT_PROFILE_VIEWER_USER_IDS:-}
      - AGENT_PROFILE_EDITOR_USER_IDS=${AGENT_PROFILE_EDITOR_USER_IDS:-}
      - AGENT_PROFILE_APPROVER_USER_IDS=${AGENT_PROFILE_APPROVER_USER_IDS:-}
      - AGENT_PROFILE_ADMIN_USER_IDS=${AGENT_PROFILE_ADMIN_USER_IDS:-}
      - AGENT_PROFILE_DYNAMIC_RBAC_ENABLED=${AGENT_PROFILE_DYNAMIC_RBAC_ENABLED:-true}
      - AGENT_PROFILE_DIRECT_PUBLISH_ENABLED=${AGENT_PROFILE_DIRECT_PUBLISH_ENABLED:-false}
      - AGENT_PROFILE_EXPERIMENTS_ENABLED=${AGENT_PROFILE_EXPERIMENTS_ENABLED:-false}
      - AGENT_PROFILE_EXPERIMENT_RECONCILE_INTERVAL=${AGENT_PROFILE_EXPERIMENT_RECONCILE_INTERVAL:-30s}
      - AGENT_PROFILE_EXPERIMENT_OBSERVATION_QUEUE_SIZE=${AGENT_PROFILE_EXPERIMENT_OBSERVATION_QUEUE_SIZE:-1024}
      - AGENT_PROFILE_CONTENT_ATTRIBUTION_WINDOW=${AGENT_PROFILE_CONTENT_ATTRIBUTION_WINDOW:-168h}
      - AGENT_PROFILE_EVAL_EVIDENCE_REQUIRED=${AGENT_PROFILE_EVAL_EVIDENCE_REQUIRED:-false}
      - AGENT_PROFILE_EVAL_CONTENT_SIGNOFF_REQUIRED=${AGENT_PROFILE_EVAL_CONTENT_SIGNOFF_REQUIRED:-false}
      - AGENT_TASK_EVAL_ARCHIVE_ENDPOINT=minio:9000
      - AGENT_TASK_EVAL_ARCHIVE_ACCESS_KEY=${AGENT_TASK_EVAL_ARCHIVE_ACCESS_KEY:-}
      - AGENT_TASK_EVAL_ARCHIVE_SECRET_KEY=${AGENT_TASK_EVAL_ARCHIVE_SECRET_KEY:-}
      - AGENT_TASK_EVAL_ARCHIVE_BUCKET=${AGENT_TASK_EVAL_ARCHIVE_BUCKET:-agent-task-eval-reports}
      - AGENT_TASK_EVAL_ARCHIVE_SECURE=false
      - AGENT_TASK_EVAL_INTEGRITY_KEY=${AGENT_TASK_EVAL_INTEGRITY_KEY:-}
      - AGENT_TASK_EVAL_INTEGRITY_KEY_ID=${AGENT_TASK_EVAL_INTEGRITY_KEY_ID:-}
      - AGENT_TASK_EVAL_REVIEW_SIGNOFF_KEY=${AGENT_TASK_EVAL_REVIEW_SIGNOFF_KEY:-}
      - AGENT_TASK_EVAL_REVIEW_SIGNOFF_KEY_ID=${AGENT_TASK_EVAL_REVIEW_SIGNOFF_KEY_ID:-}
      - AGENT_TOOL_RESULT_INLINE_MAX_BYTES=${AGENT_TOOL_RESULT_INLINE_MAX_BYTES:-65536}
      - AGENT_TOOL_RESULT_MAX_BYTES=${AGENT_TOOL_RESULT_MAX_BYTES:-1048576}
      - AGENT_TOOL_RESULT_OBJECT_STORE_ENABLED=true
      - AGENT_TOOL_RESULT_MINIO_ENDPOINT=minio:9000
      - AGENT_TOOL_RESULT_MINIO_ACCESS_KEY=${MINIO_USER}
      - AGENT_TOOL_RESULT_MINIO_SECRET_KEY=${MINIO_PASSWORD}
      - AGENT_TOOL_RESULT_MINIO_BUCKET=agent-tool-results
      - AGENT_TOOL_RESULT_MINIO_SECURE=false
      - ES_ADDRESSES=http://elasticsearch:9200
      - QDRANT_URL=http://qdrant:6333
      - LM_STUDIO_API_URL=http://host.docker.internal:1234/v1
      - LM_STUDIO_MODEL_EMBEDDING=text-embedding-bge-m3
      - JAEGER_COLLECTOR_ENDPOINT=jaeger:4317
      - DASHSCOPE_API_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - LM_STUDIO_MODEL_CHAT=qwen2.5-3b-instruct
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=root
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_DB_NAME=twitter_agent
      - TEMPORAL_HOST=temporal:7233
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=twitter
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MQ_HOST=rabbitmq
      - MQ_PORT=5672
      - MQ_USER=guest
      - MQ_PASSWORD=guest
    restart: on-failure
    depends_on:
      elasticsearch:
        condition: service_healthy
      mongodb:
        condition: service_started
      temporal:
        condition: service_started
      qdrant:
        condition: service_started
      minio:
        condition: service_started

  # === 网关 ===
  gateway:
    build:
      context: .
      dockerfile: deploy/docker/gateway.dockerfile
    environment:
      - GATEWAY_PORT=9638
      - USER_SERVICE_ADDR=user-service:9091
      - TWEET_SERVICE_ADDR=tweet-service:9092
      - TWEET_INTERNAL_SERVICE_IDENTITY=${TWEET_INTERNAL_SERVICE_IDENTITY:-agent-service}
      - TWEET_INTERNAL_SERVICE_TOKEN=${TWEET_INTERNAL_SERVICE_TOKEN:-}
      - FOLLOW_SERVICE_ADDR=follow-service:9093
      - MESSENGER_SERVICE_ADDR=messenger-service:9094
      - AGENT_SERVICE_ADDR=agent-service:9100
      - AGENT_EXTENSION_MARKETPLACE_ADMIN_ENABLED=${AGENT_EXTENSION_MARKETPLACE_ADMIN_ENABLED:-false}
      - AGENT_EXTENSION_MARKETPLACE_ADMIN_TOKEN=${AGENT_EXTENSION_MARKETPLACE_ADMIN_TOKEN:-}
      - AGENT_PROFILE_ADMIN_TOKEN=${AGENT_PROFILE_ADMIN_TOKEN:-}
      - AGENT_PROFILE_VIEWER_USER_IDS=${AGENT_PROFILE_VIEWER_USER_IDS:-}
      - AGENT_PROFILE_EDITOR_USER_IDS=${AGENT_PROFILE_EDITOR_USER_IDS:-}
      - AGENT_PROFILE_APPROVER_USER_IDS=${AGENT_PROFILE_APPROVER_USER_IDS:-}
      - AGENT_PROFILE_ADMIN_USER_IDS=${AGENT_PROFILE_ADMIN_USER_IDS:-}
      - AGENT_PROFILE_DIRECT_PUBLISH_ENABLED=${AGENT_PROFILE_DIRECT_PUBLISH_ENABLED:-false}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=twitter
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_SAMPLER_TYPE=const
      - JAEGER_SAMPLER_PARAM=1
      - JAEGER_COLLECTOR_ENDPOINT=jaeger:4317
      - AUTH_SERVICE_JWKS_URL=http://auth-service:8081/.well-known/jwks.json
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
      - SENTINEL_DASHBOARD_ADDR=sentinel:9124
      - SENTINEL_TRANSPORT_PORT=8719
      - SENTINEL_APP_NAME=gateway
      - SENTINEL_LOG_DIR=/tmp/sentinel/logs
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_USER}
      - MINIO_SECRET_KEY=${MINIO_PASSWORD}
      - MINIO_PUBLIC_URL=http://localhost:9000
      - MINIO_BUCKET=twitter-media
    ports:
      - "9638:9638"
    restart: on-failure
    depends_on:
      - auth-service
      - user-service
      - tweet-service
      - follow-service
      - notification-service

  notification-service:
    build:
      context: .
      dockerfile: deploy/docker/notification.dockerfile
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=twitter
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MQ_HOST=rabbitmq
      - MQ_PORT=5672
      - MQ_USER=guest
      - MQ_PASSWORD=guest
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - SERVICE_NAME=notification-service
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_SAMPLER_TYPE=const
      - JAEGER_SAMPLER_PARAM=1
      - JAEGER_COLLECTOR_ENDPOINT=jaeger:4317
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  messenger-service:
    build:
      context: .
      dockerfile: deploy/docker/messenger.dockerfile
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=twitter
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - SERVICE_NAME=messenger-service
      - SERVICE_ADDR=messenger-service
      - SERVICE_PORT=9094
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_SAMPLER_TYPE=const
      - JAEGER_SAMPLER_PARAM=1
      - JAEGER_COLLECTOR_ENDPOINT=jaeger:4317
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Temporal Server (连接已有 MySQL 数据库并自适应初始化建表)
  temporal:
    image: temporalio/auto-setup:1.24.0
    container_name: temporal
    ports:
      - "7233:7233"
    environment:
      - DB=mysql8
      - MYSQL_SEEDS=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PWD=${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy

  # Temporal Web UI
  temporal-ui:
    image: temporalio/ui:2.24.0
    container_name: temporal-ui
    ports:
      - "8233:8233"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

  # Sentinel Dashboard
  sentinel:
    image: bladex/sentinel-dashboard
    ports:
      - "8858:8858"
    restart: always

  # Pyroscope Server
  pyroscope:
    image: grafana/pyroscope:latest
    ports:
      - "4040:4040"
    restart: always
    volumes:
      - pyroscope-data:/var/lib/pyroscope


  frontend:
    build:
      context: ./web        # 前端项目路径
      dockerfile: Dockerfile
    ports:
      - "5173:5556"
    depends_on:
        - gateway

volumes:
  mysql_data:
  mongodb_data:
  es_data:
  qdrant_data:
  prometheus_data:
  loki_data:
  temporal_db:
  pyroscope-data:
  minio_data:
