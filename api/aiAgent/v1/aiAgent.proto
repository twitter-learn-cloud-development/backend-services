syntax = "proto3";

package aiAgent.v1;
option go_package = "twitter-clone/api/aiAgent/v1;aiAgentv1";

// AiAgentService 智能体服务
service AiAgentService {
    // List active immutable Skill versions projected from governed publications.
    rpc listAgentSkills (ListAgentSkillsRequest) returns (ListAgentSkillsResponse);
    // Resolve one exact Skill version. "Latest" resolution is intentionally unsupported.
    rpc getAgentSkill (GetAgentSkillRequest) returns (GetAgentSkillResponse);
    // List tenant-visible built-in capabilities, immutable Skills and reviewed MCP tools.
    rpc listAgentExtensions (ListAgentExtensionsRequest) returns (ListAgentExtensionsResponse);
    // List signature-verified public extension releases. This does not install or authorize them.
    rpc listAgentMarketplaceExtensions (ListAgentMarketplaceExtensionsRequest) returns (ListAgentMarketplaceExtensionsResponse);
    // Authenticated extension publisher control plane. It stores public keys and signed metadata only.
    rpc getAgentMarketplaceManagementAccess (GetAgentMarketplaceManagementAccessRequest) returns (GetAgentMarketplaceManagementAccessResponse);
    rpc listAgentMarketplacePublishers (ListAgentMarketplacePublishersRequest) returns (ListAgentMarketplacePublishersResponse);
    rpc registerAgentMarketplacePublisher (RegisterAgentMarketplacePublisherRequest) returns (RegisterAgentMarketplacePublisherResponse);
    rpc rotateAgentMarketplacePublisherKey (RotateAgentMarketplacePublisherKeyRequest) returns (RotateAgentMarketplacePublisherKeyResponse);
    rpc revokeAgentMarketplacePublisherKey (RevokeAgentMarketplacePublisherKeyRequest) returns (RevokeAgentMarketplacePublisherKeyResponse);
    rpc setAgentMarketplacePublisherVerification (SetAgentMarketplacePublisherVerificationRequest) returns (SetAgentMarketplacePublisherVerificationResponse);
    rpc listAgentMarketplaceManagedReleases (ListAgentMarketplaceManagedReleasesRequest) returns (ListAgentMarketplaceManagedReleasesResponse);
    rpc publishAgentMarketplaceRelease (PublishAgentMarketplaceReleaseRequest) returns (PublishAgentMarketplaceReleaseResponse);
    rpc withdrawAgentMarketplaceRelease (WithdrawAgentMarketplaceReleaseRequest) returns (WithdrawAgentMarketplaceReleaseResponse);
    rpc listAgentMarketplaceAuditEvents (ListAgentMarketplaceAuditEventsRequest) returns (ListAgentMarketplaceAuditEventsResponse);
    // Explicitly save a reusable task preset from one completed authoritative Agent Run.
    rpc createAgentTaskTemplate (CreateAgentTaskTemplateRequest) returns (CreateAgentTaskTemplateResponse);
    // List active task templates. The response also exposes the execution rollout state.
    rpc listAgentTaskTemplates (ListAgentTaskTemplatesRequest) returns (ListAgentTaskTemplatesResponse);
    // Archive template metadata without deleting its source-run evidence.
    rpc archiveAgentTaskTemplate (ArchiveAgentTaskTemplateRequest) returns (ArchiveAgentTaskTemplateResponse);
    // Render one immutable template revision and execute it through the unified Agent entry.
    rpc runAgentTaskTemplate (RunAgentTaskTemplateRequest) returns (RunAgentResponse);
    // 获取模型初始化详细信息
    rpc getModelDetailedInformation (getModelDetailedInformationRequest) returns (getModelDetailedInformationResponse);
    // 获取历史对话列表
    rpc getRepositoryDialogue (getRepositoryDialogueRequest) returns (getRepositoryDialogueResponse);
    // 获取某个历史对话的详细消息记录
    rpc getDialogueDetail (getDialogueDetailRequest) returns (getDialogueDetailResponse);
    // Explicitly finalize pending episodic memory while preserving the dialogue.
    rpc endDialogueSession (EndDialogueSessionRequest) returns (EndDialogueSessionResponse);
    // 解析前端 pdf、word 和图片等文件
    rpc analysisFiles (analysisFilesRequest) returns (analysisFilesResponse);
    // P8 统一智能助手入口；preferred_capability_ids 仅作为偏好，不授予工具权限。
    rpc runAgent (RunAgentRequest) returns (RunAgentResponse);
    // 查询当前用户所属的权威 Agent Run 生命周期，不返回 Checkpoint 密文或领取租约。
    rpc getAgentRun (GetAgentRunRequest) returns (GetAgentRunResponse);
    // 聚合父 Agent Run 与其直接子 Workflow Run 的版本化预算和用量快照。
    rpc getAgentRunAccounting (GetAgentRunAccountingRequest) returns (GetAgentRunAccountingResponse);
    // 使用人工回答原子领取并恢复 ask_human Run；expected_revision 防止重复提交。
    rpc resumeAgentRun (ResumeAgentRunRequest) returns (RunAgentResponse);
    // 为已批准的 Runtime 工具动作签发短期一次性恢复令牌。
    rpc issueAgentResumeGrant (IssueAgentResumeGrantRequest) returns (IssueAgentResumeGrantResponse);
    // 模式一：直接调用 AI api 进行对话
    rpc callApiOfAi (callApiOfAiRequest) returns (callApiOfAiResponse);
    // 模式二：通过对话查询相关推文和作者
    rpc consultContent (consultContentRequest) returns (consultContentResponse);
    // 模式三：通过提供写作信息协助构建推文
    rpc assistPublishTwitter (assistPublishTwitterRequest) returns (assistPublishTwitterResponse);
    // 模式三第二阶段：用户确认后发布推文
    rpc confirmPublishTwitter (ConfirmPublishTwitterRequest) returns (ConfirmPublishTwitterResponse);
    // 模式四：Search Agent、Style Agent、Write Agent三智能体协同推文书写（深度研究模式）
    rpc multiAgentPublishTwitter (MultiAgentPublishTwitterRequest) returns (MultiAgentPublishTwitterResponse);
    // 告警分析与根因诊断 (AIOps)
    rpc analyzeAlert (AnalyzeAlertRequest) returns (AnalyzeAlertResponse);
    // 保存用户自定义工作流 DSL
    rpc createWorkflow (CreateWorkflowRequest) returns (CreateWorkflowResponse);
    // 更新用户自定义工作流 DSL
    rpc updateWorkflow (UpdateWorkflowRequest) returns (UpdateWorkflowResponse);
    // 获取用户工作流列表
    rpc listWorkflows (ListWorkflowsRequest) returns (ListWorkflowsResponse);
    // 获取单个工作流 DSL
    rpc getWorkflow (GetWorkflowRequest) returns (GetWorkflowResponse);
    // 分页查询工作流的不可变历史版本。
    rpc listWorkflowRevisions (ListWorkflowRevisionsRequest) returns (ListWorkflowRevisionsResponse);
    // 查询指定不可变工作流版本。
    rpc getWorkflowRevision (GetWorkflowRevisionRequest) returns (GetWorkflowRevisionResponse);
    // Publish one immutable, read-only workflow revision into the user's Runtime tool catalog.
    rpc publishWorkflowTool (PublishWorkflowToolRequest) returns (PublishWorkflowToolResponse);
    rpc getWorkflowToolPublication (GetWorkflowToolPublicationRequest) returns (GetWorkflowToolPublicationResponse);
    rpc unpublishWorkflowTool (UnpublishWorkflowToolRequest) returns (UnpublishWorkflowToolResponse);
    // 运行工作流
    rpc runWorkflow (RunWorkflowRequest) returns (RunWorkflowResponse);
    // 获取工作流运行记录
    rpc getWorkflowRun (GetWorkflowRunRequest) returns (GetWorkflowRunResponse);
    // 查询与业务 output_json 解耦的脱敏 Run/Step/LLM/Tool 执行追踪。
    rpc getWorkflowRunTrace (GetWorkflowRunTraceRequest) returns (GetWorkflowRunTraceResponse);
    // 检索指定运行版本的已验证、脱敏 Blackboard 快照。
    rpc searchWorkflowBlackboard (SearchWorkflowBlackboardRequest) returns (SearchWorkflowBlackboardResponse);
    // 流式投递脱敏执行事件；客户端使用 after_cursor 断点续传。
    rpc watchWorkflowRunEvents (WatchWorkflowRunEventsRequest) returns (stream WorkflowRunEvent);
    // 分页查询当前用户的工作流运行记录。
    rpc listWorkflowRuns (ListWorkflowRunsRequest) returns (ListWorkflowRunsResponse);
    // 请求取消仍在执行的工作流；取消状态由持久化控制面跨实例传播。
    rpc cancelWorkflowRun (CancelWorkflowRunRequest) returns (CancelWorkflowRunResponse);
    // 获取只读运行回放证据；不会重新执行节点、模型或工具。
    rpc getWorkflowRunReplay (GetWorkflowRunReplayRequest) returns (GetWorkflowRunReplayResponse);
    // 查询脱敏后的持久补偿 Journal 和当前可执行的人工动作。
    rpc getWorkflowCompensationJournal (GetWorkflowCompensationJournalRequest) returns (GetWorkflowCompensationJournalResponse);
    // 显式重试失败或中断的持久补偿；不会重放主 DAG。
    rpc retryWorkflowCompensation (RetryWorkflowCompensationRequest) returns (RetryWorkflowCompensationResponse);
    // 查询当前用户的工具审批请求。
    rpc listToolApprovals (ListToolApprovalsRequest) returns (ListToolApprovalsResponse);
    // 批准或拒绝工具执行，使用 revision 防止重复决策。
    rpc decideToolApproval (DecideToolApprovalRequest) returns (DecideToolApprovalResponse);
    // 为已批准且仍挂起的 Run 签发短时、单次恢复授权；签发会使旧恢复令牌失效。
    rpc issueWorkflowResumeGrant (IssueWorkflowResumeGrantRequest) returns (IssueWorkflowResumeGrantResponse);
    // 使用一次性恢复令牌继续已挂起的工作流；空令牌仅用于显式重试持久补偿 Journal。
    rpc resumeWorkflowRun (ResumeWorkflowRunRequest) returns (ResumeWorkflowRunResponse);
    // 创建用户级 OpenAI-compatible Provider 配置，API Key 仅加密存储。
    rpc createProviderConfig (CreateProviderConfigRequest) returns (CreateProviderConfigResponse);
    // 更新 Provider 元数据或轮换 API Key。
    rpc updateProviderConfig (UpdateProviderConfigRequest) returns (UpdateProviderConfigResponse);
    rpc listProviderConfigs (ListProviderConfigsRequest) returns (ListProviderConfigsResponse);
    rpc getProviderConfig (GetProviderConfigRequest) returns (GetProviderConfigResponse);
    // 撤销配置并清除服务端密文。
    rpc revokeProviderConfig (RevokeProviderConfigRequest) returns (RevokeProviderConfigResponse);
    // Agent Project 是项目级 MCP 连接的成员权限事实源。
    rpc createAgentProject (CreateAgentProjectRequest) returns (CreateAgentProjectResponse);
    rpc listAgentProjects (ListAgentProjectsRequest) returns (ListAgentProjectsResponse);
    rpc getAgentProject (GetAgentProjectRequest) returns (GetAgentProjectResponse);
    rpc upsertAgentProjectMember (UpsertAgentProjectMemberRequest) returns (UpsertAgentProjectMemberResponse);
    rpc removeAgentProjectMember (RemoveAgentProjectMemberRequest) returns (RemoveAgentProjectMemberResponse);
    // 个人/项目级远程 MCP 连接控制面。凭据只在创建/轮换请求中出现。
    rpc createExternalMCPConnection (CreateExternalMCPConnectionRequest) returns (CreateExternalMCPConnectionResponse);
    rpc updateExternalMCPConnection (UpdateExternalMCPConnectionRequest) returns (UpdateExternalMCPConnectionResponse);
    rpc listExternalMCPConnections (ListExternalMCPConnectionsRequest) returns (ListExternalMCPConnectionsResponse);
    rpc getExternalMCPConnection (GetExternalMCPConnectionRequest) returns (GetExternalMCPConnectionResponse);
    rpc revokeExternalMCPConnection (RevokeExternalMCPConnectionRequest) returns (RevokeExternalMCPConnectionResponse);
    // Discovery 只生成待审核的不可变 Schema Snapshot，不授予执行权限。
    rpc discoverExternalMCPTools (DiscoverExternalMCPToolsRequest) returns (DiscoverExternalMCPToolsResponse);
    rpc approveExternalMCPSnapshot (ApproveExternalMCPSnapshotRequest) returns (ApproveExternalMCPSnapshotResponse);
    rpc listExternalMCPTools (ListExternalMCPToolsRequest) returns (ListExternalMCPToolsResponse);
    rpc configureExternalMCPTool (ConfigureExternalMCPToolRequest) returns (ConfigureExternalMCPToolResponse);
    rpc createAgentProfileDraft (CreateAgentProfileDraftRequest) returns (CreateAgentProfileDraftResponse);
    rpc publishAgentProfileVersion (PublishAgentProfileVersionRequest) returns (PublishAgentProfileVersionResponse);
    rpc requestAgentProfilePublishApproval (RequestAgentProfilePublishApprovalRequest) returns (RequestAgentProfilePublishApprovalResponse);
    rpc listAgentProfilePublishApprovals (ListAgentProfilePublishApprovalsRequest) returns (ListAgentProfilePublishApprovalsResponse);
    rpc getAgentProfilePublishApproval (GetAgentProfilePublishApprovalRequest) returns (GetAgentProfilePublishApprovalResponse);
    rpc decideAgentProfilePublishApproval (DecideAgentProfilePublishApprovalRequest) returns (DecideAgentProfilePublishApprovalResponse);
    rpc retryAgentProfilePublishApproval (RetryAgentProfilePublishApprovalRequest) returns (RetryAgentProfilePublishApprovalResponse);
    rpc listAgentProfileVersions (ListAgentProfileVersionsRequest) returns (ListAgentProfileVersionsResponse);
    rpc getAgentProfileVersion (GetAgentProfileVersionRequest) returns (GetAgentProfileVersionResponse);
    rpc getAgentProfileRelease (GetAgentProfileReleaseRequest) returns (GetAgentProfileReleaseResponse);
    rpc upsertAgentProfileRelease (UpsertAgentProfileReleaseRequest) returns (UpsertAgentProfileReleaseResponse);
    rpc listAgentProfileAuditEvents (ListAgentProfileAuditEventsRequest) returns (ListAgentProfileAuditEventsResponse);
    rpc getAgentProfileManagementAccess (GetAgentProfileManagementAccessRequest) returns (GetAgentProfileManagementAccessResponse);
    rpc listAgentProfileRoleBindings (ListAgentProfileRoleBindingsRequest) returns (ListAgentProfileRoleBindingsResponse);
    rpc upsertAgentProfileRoleBinding (UpsertAgentProfileRoleBindingRequest) returns (UpsertAgentProfileRoleBindingResponse);
    rpc deleteAgentProfileRoleBinding (DeleteAgentProfileRoleBindingRequest) returns (DeleteAgentProfileRoleBindingResponse);
    rpc listAgentProfileRoleAuditEvents (ListAgentProfileRoleAuditEventsRequest) returns (ListAgentProfileRoleAuditEventsResponse);
    rpc startAgentProfileExperiment (StartAgentProfileExperimentRequest) returns (StartAgentProfileExperimentResponse);
    rpc listAgentProfileExperiments (ListAgentProfileExperimentsRequest) returns (ListAgentProfileExperimentsResponse);
    rpc getAgentProfileExperiment (GetAgentProfileExperimentRequest) returns (GetAgentProfileExperimentResponse);
    rpc evaluateAgentProfileExperiment (EvaluateAgentProfileExperimentRequest) returns (EvaluateAgentProfileExperimentResponse);
    rpc stopAgentProfileExperiment (StopAgentProfileExperimentRequest) returns (StopAgentProfileExperimentResponse);
    rpc recordAgentProfileExperimentOutcome (RecordAgentProfileExperimentOutcomeRequest) returns (RecordAgentProfileExperimentOutcomeResponse);
}


// =========== 基础消息定义 ============

// 对话必备内容
message MainContent {
    uint64 id          = 1;
    uint64 user_id     = 2;
    uint64 dialogue_id = 3;
    string content     = 4;
    string dialogue_key = 5;
}

// 单条历史消息记录
message RepositoryContentList {
    uint64 id          = 1;
    uint64 user_id     = 2;
    uint64 dialogue_id = 3;
    string question    = 4;
    string response    = 5;
    string dialogue_key = 6;
    string role        = 7;
    string content     = 8;
    string run_id      = 9;  // 白名单化的 Runtime Run ID
    bool publishable_draft = 10; // 是否来自可显式确认发布的 Assist 草稿
}

// 历史对话（标题级别）
message RepositoryDialogue {
    uint64 id      = 1;
    uint64 user_id = 2;
    string title   = 3;
    string dialogue_key = 4;
}

// 文件类型
message FileKind {
    uint64 id   = 1;
    string name = 2;
}

// 模型信息
message ModelKind {
    uint64          id             = 1;
    string          name           = 2;
    string          description    = 3;
    uint32          max_tokens     = 4;
    repeated FileKind file_kind_list = 5;
}

// Poll 投票
message Poll {
	uint64 id = 1;
	uint64 tweet_id = 2;
	string question = 3;
	repeated PollOption options = 4;
	int64 end_time = 5;
	bool is_expired = 6; // 计算字段
	bool is_voted = 7;   // 当前用户是否已投票
	uint64 voted_option_id = 8; // 当前用户投的选项 ID
	int32 total_votes = 9;
}

// PollOption 投票选项
message PollOption {
	uint64 id = 1;
	uint64 poll_id = 2;
	string text = 3;
	int32 vote_count = 4;
	float percentage = 5; // 计算字段：百分比 (0-100)
}

// 推文
message Tweet {
    uint64          id           = 1;
    uint64          user_id      = 2;
    string          content      = 3;
    repeated string media_urls   = 4;
    int32           type         = 5;
    int32           visible_type = 6;
    int64           created_at   = 7;
    int64           updated_at   = 8;
    int32           like_count   = 9;
    int32           comment_count = 10;
    int32           share_count  = 11;
    bool            is_liked     = 12;
    uint64          parent_id    = 13;
    Poll            poll         = 14;
}

// 推文查询结果条目
message TweetResult {
    uint64 tweet_id  = 1;
    string url       = 2;  // 站内访问 URL，如 /tweet/123456
    string summary   = 3;  // AI 对这条推文的简短摘要，方便用户决定要不要点进去
}

// ========== 请求与响应消息体 ==========

message getModelDetailedInformationRequest {
    uint64 user_id = 1;
}
message getModelDetailedInformationResponse {
    uint64            code           = 1;
    string            msg            = 2;
    repeated ModelKind model_kind_list = 3;
}

message getRepositoryDialogueRequest {
    uint64 user_id = 1;
}
message getRepositoryDialogueResponse {
    uint64                    code                   = 1;
    string                    msg                    = 2;
    repeated RepositoryDialogue repository_dialogue_list = 3;
}

message getDialogueDetailRequest {
    uint64 user_id     = 1;
    uint64 dialogue_id = 2;
    string dialogue_key = 3;
}
message getDialogueDetailResponse {
    uint64                       code     = 1;
    string                       msg      = 2;
    repeated RepositoryContentList messages = 3;
}

message EndDialogueSessionRequest {
    uint64 user_id = 1;
    uint64 dialogue_id = 2;
    string dialogue_key = 3;
}

message EndDialogueSessionResponse {
    uint64 code = 1;
    string msg = 2;
}

message analysisFilesRequest {
    uint64 user_id       = 1;
    uint64 file_kind_id  = 2;
    bytes  file_content  = 3;
}
message analysisFilesResponse {
    uint64 code           = 1;
    string msg            = 2;
    string parsed_content = 3; // 解析出的文本内容，供后续对话使用
    string file_key       = 4; // 存储 key，后续对话可引用
}

message RunAgentRequest {
    uint64 user_id = 1;
    uint64 model_kind_id = 2;
    MainContent main_content = 3;
    // Optional planner hints. The server still applies catalog, policy, budget and approval checks.
    repeated string preferred_capability_ids = 4;
    // Optional tenant-owned encrypted web provider configuration. The secret is never returned.
    string web_search_provider_config_id = 5;
    // Explicit immutable Skill selection. Both fields must be supplied together.
    string skill_id = 6;
    string skill_version = 7;
}

message AgentToolActivity {
    int32 step_index = 1;
    string tool_name = 2;
    string status = 3;
    int32 result_count = 4;
}

message AgentCitation {
    string citation_id = 1;
    string source_type = 2;
    string source_id = 3;
    string url = 4;
    string title = 5;
    string snippet = 6;
}

message AgentArtifact {
    string artifact_id = 1;
    string type = 2;
    string status = 3;
    string content_type = 4;
    string content = 5;
    string source_run_id = 6;
    bool requires_confirmation = 7;
}

message AgentApprovalState {
    string status = 1;
    string approval_id = 2;
    string run_id = 3;
    string action = 4;
    int64 revision = 5;
    // Unix milliseconds. Zero means the state has no expiry.
    int64 expires_at = 6;
    bool resume_supported = 7;
}

message AgentExecutionStrategyRole {
    string role_id = 1;
    repeated string capability_ids = 2;
    repeated string allowed_tools = 3;
    int32 max_steps = 4;
    int32 max_total_tokens = 5;
    int64 max_estimated_cost_micros = 6;
    int64 timeout_millis = 7;
}

// Sanitized, versioned admission evidence. It never contains prompts, raw
// requests, credentials or tool arguments and does not itself grant tools.
message AgentExecutionStrategyPlan {
    string version = 1;
    string template_id = 2;
    string candidate_strategy = 3;
    string selected_strategy = 4;
    string decision = 5;
    string reason_code = 6;
    int32 complexity_score = 7;
    string complexity_class = 8;
    repeated string complexity_signals = 9;
    int64 estimated_latency_millis = 10;
    int32 estimated_total_tokens = 11;
    int64 estimated_cost_micros = 12;
    int32 max_parallel_roles = 13;
    repeated AgentExecutionStrategyRole roles = 14;
    string plan_digest = 15;
}

message RunAgentResponse {
    uint64 code = 1;
    string msg = 2;
    string response = 3;
    string dialogue_key = 4;
    string run_id = 5;
    // Compatibility profile selected by the first P8 migration planner.
    string execution_profile = 6;
    // Capabilities actually selected for this response, not requested permissions.
    repeated string capability_ids = 7;
    repeated TweetResult tweet_list = 8;
    bool publishable_draft = 9;
    // Sanitized execution evidence. Tool arguments and raw observations are never returned.
    repeated AgentToolActivity tool_activities = 10;
    // Verifiable source records derived from structured tool results, never from answer text.
    repeated AgentCitation citations = 11;
    // Typed outputs projected from the persisted Run.
    repeated AgentArtifact artifacts = 12;
    // Sanitized approval projection. Never contains inputs or resume credentials.
    AgentApprovalState approval_state = 13;
    string run_status = 14;
    string selected_skill_id = 15;
    string selected_skill_version = 16;
    string selected_task_template_id = 17;
    int64 selected_task_template_revision = 18;
    AgentExecutionStrategyPlan execution_strategy_plan = 19;
}

message AgentExecutionRun {
    string run_id = 1;
    string dialogue_key = 2;
    string execution_profile = 3;
    repeated string capability_ids = 4;
    string status = 5;
    int64 revision = 6;
    bool resume_supported = 7;
    string pending_action_type = 8;
    string pending_action_name = 9;
    int32 step_count = 10;
    int32 input_tokens = 11;
    int32 output_tokens = 12;
    int32 total_tokens = 13;
    int64 estimated_cost_micros = 14;
    string pricing_version = 15;
    string failure_code = 16;
    int64 started_at = 17;
    int64 updated_at = 18;
    int64 suspended_at = 19;
    int64 finished_at = 20;
    string pending_action_id = 21;
    string approval_id = 22;
    int64 approval_expires_at = 23;
    string skill_id = 24;
    string skill_version = 25;
    string task_template_id = 26;
    int64 task_template_revision = 27;
    AgentExecutionStrategyPlan execution_strategy_plan = 28;
}

message AgentSkillKnowledgeBinding {
    string kind = 1;
    string reference = 2;
    string version = 3;
}

message AgentSkillProfileBinding {
    string profile_id = 1;
    string profile_version = 2;
    string prompt_id = 3;
    string prompt_version = 4;
}

message AgentSkillBudget {
    int32 max_steps = 1;
    int32 max_input_tokens = 2;
    int32 max_output_tokens = 3;
    int32 max_total_tokens = 4;
    int64 max_estimated_cost_micros = 5;
    int64 timeout_seconds = 6;
}

message AgentSkillOutputContract {
    string schema_id = 1;
    string content_type = 2;
    string schema_json = 3;
}

message AgentSkillWorkflowBinding {
    string publication_id = 1;
    int64 publication_revision = 2;
    string workflow_id = 3;
    string workflow_revision_id = 4;
    int64 workflow_revision_number = 5;
    string workflow_dsl_hash = 6;
    string tool_name = 7;
    string input_schema_json = 8;
}

message AgentSkill {
    string contract_version = 1;
    string skill_id = 2;
    string version = 3;
    string display_name = 4;
    string description = 5;
    string instructions = 6;
    string source = 7;
    repeated string allowed_tools = 8;
    repeated AgentSkillKnowledgeBinding knowledge = 9;
    AgentSkillProfileBinding profile = 10;
    AgentSkillBudget budget = 11;
    AgentSkillOutputContract output = 12;
    AgentSkillWorkflowBinding workflow = 13;
}

message ListAgentSkillsRequest {
    uint64 user_id = 1;
    int32 limit = 2;
}

message ListAgentSkillsResponse {
    uint64 code = 1;
    string msg = 2;
    repeated AgentSkill skills = 3;
}

message GetAgentSkillRequest {
    uint64 user_id = 1;
    string skill_id = 2;
    string version = 3;
}

message GetAgentSkillResponse {
    uint64 code = 1;
    string msg = 2;
    AgentSkill skill = 3;
}

message AgentExtensionSkillReference {
    string skill_id = 1;
    string version = 2;
}

message AgentExtensionMCPReference {
    string connection_id = 1;
    string server_id = 2;
    string snapshot_id = 3;
    string qualified_tool_name = 4;
}

// AgentExtension is a credential-free discovery projection. It is not an
// execution grant; Runtime policy, budget and approval remain authoritative.
message AgentExtension {
    string contract_version = 1;
    string extension_id = 2;
    string kind = 3;
    string name = 4;
    string display_name = 5;
    string description = 6;
    string version = 7;
    string source = 8;
    string capability_id = 9;
    string category = 10;
    string scope = 11;
    string status = 12;
    string approval_mode = 13;
    string health_status = 14;
    AgentExtensionSkillReference skill = 15;
    AgentExtensionMCPReference mcp = 16;
}

message AgentExtensionSourceStatus {
    string source = 1;
    string state = 2;
    int32 entry_count = 3;
}

message ListAgentExtensionsRequest {
    uint64 user_id = 1;
    string kind = 2;
    string category = 3;
    string scope = 4;
    string status = 5;
    string search = 6;
    string after_cursor = 7;
    int32 page_size = 8;
}

message ListAgentExtensionsResponse {
    uint64 code = 1;
    string msg = 2;
    string contract_version = 3;
    repeated AgentExtension extensions = 4;
    repeated AgentExtensionSourceStatus sources = 5;
    string next_cursor = 6;
    bool has_more = 7;
}

message AgentMarketplacePublisher {
    string publisher_id = 1;
    string display_name = 2;
    string verification = 3;
}

// AgentMarketplaceExtension exposes verified metadata only. Package bytes,
// publisher public keys, signatures and installation grants are not returned.
message AgentMarketplaceExtension {
    string contract_version = 1;
    string release_id = 2;
    string package_id = 3;
    string kind = 4;
    string version = 5;
    string display_name = 6;
    string description = 7;
