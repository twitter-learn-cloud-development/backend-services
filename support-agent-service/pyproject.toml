[project]
name = "support-agent-service"
version = "0.1.0"
description = "User-facing support agent runtime for Twitter Clone"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "jsonschema>=4.23,<5.0",
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-mongodb>=0.5,<1.0",
    "opentelemetry-api>=1.30,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2.0",
    "opentelemetry-sdk>=1.30,<2.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "prometheus-client>=0.21,<1.0",
    "qdrant-client>=1.19,<2.0",
    "structlog>=24.4,<26.0",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.34,<1.0",
    "pyjwt[crypto]>=2.10,<3.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.390,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pyyaml>=6.0,<7.0",
    "ruff>=0.9,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["app", "tests"]
exclude = [".venv"]
reportMissingTypeStubs = false
